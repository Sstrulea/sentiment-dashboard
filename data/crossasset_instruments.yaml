        components:
          rate_exp_2y:    { sign: -1, weight: 1.0 }
          real_yield_10y: { sign: -1, weight: 1.0 }
          balance_sheet:  { sign: -1, weight: 1.0 }   # Fed net liquidity; rising = easing = bullish
      sentiment: { sign: 1, weight: 0.5 }   # SENTIMENT cell (P/C equity, US index); weight 0.5 in the score
      trend:     { sign: 1, weight: 0.5 }   # TREND cell (price MA×ADX, ±3); weight 0.5 — has US500 price series
  NASDAQ:
