# Cross-Asset instrument definitions (indices + metals).
#
# Each instrument derives a bias from TOP-LEVEL factors {growth, inflation,
# labour, rates}:
#   - growth/inflation/labour read the instrument's HOME currency category
#     score (build_payload `score_cell`, −2..+2);
#   - `rates` is a COMPOSITE — the weighted mean of its present sub-components
#     {rate_exp_2y (home-ccy 2y / monetary), real_yield_10y (global US 10y real)}.
#     Grouping bounds the combined rate signal at ±2 (aligned 2y+10y don't stack
#     to ±4); a future balance_sheet sub-component slots in here (Step 7).
#
# RAW convention (same as the FX category scores + raw real-yield score):
#   + = hawkish / strong economy / rising yield.
# `sign` turns that raw into the instrument's directional contribution; `weight`
# is the weight in the weighted mean. Instrument score = weighted mean over
# PRESENT top-level factors × scale — a missing factor (or rate sub-component)
# is excluded, never zero-filled. No separate USD factor for metals (the USD
# categories already cover the dollar — avoids double-counting).
#
# bias_thresholds calibrated at 6.6 (mirror of 6.4 method on the new scoring).
#
# §Q1 recalibration (2026-07-28): re-derived on the post-D distribution (same
# reason as the FX board's economic_instruments.yaml — see
# docs/Q1-recalibration-2026-07-28.md). mild=1.50 lands close to a real
# cluster in this board's |score| distribution (p50=1.48, p55=1.50 — ~5% of
# the mass sits in a 0.02-wide band): measured instability under a ±0.05
# score perturbation rose from 1.65% to 9.43% of instrument-weeks under the
# new threshold. Reported and accepted as-is (see the doc) — do not nudge
# `mild` off the measured percentile to "fix" this without discussing it
# first; that would be adjusting the result, not the method.
# GUARDRAIL: re-deriving again requires the SAME kind of evidence that
# justified this pass — a demonstrated STRUCTURAL JUMP in the score
# distribution, not merely "the split has drifted from 55/10". A gradual
# decline does not qualify.

scale: 5
bias_thresholds:
  mild: 1.50    # §Q1 (2026-07-28): p55 of |score|, post-D, 53-week window
  very: 3.33    # §Q1 (2026-07-28): p90 of |score|, post-D, 53-week window

instruments:
  # --- Indices ---
  DJIA:
    type: index
    home_ccy: USD
    factors:
      growth:    { sign: 1,  weight: 1.0 }
      inflation: { sign: -1, weight: 1.0 }
      labour:    { sign: 1,  weight: 1.0 }   # risk-on: strong jobs (NFP beat) = bullish US index (A1-aligned)
      rates:
        weight: 1.0
        components:
          rate_exp_2y:    { sign: -1, weight: 1.0 }
          real_yield_10y: { sign: -1, weight: 1.0 }
          balance_sheet:  { sign: -1, weight: 1.0 }   # Fed net liquidity; rising = easing = bullish
      sentiment: { sign: 1, weight: 0.5 }   # SENTIMENT cell (P/C equity, US index); weight 0.5 in the score
      trend:     { sign: 1, weight: 0.5 }   # TREND cell (price MA×ADX, ±3); weight 0.5 — has US30 price series
  SP500:
