# Cross-Asset instrument definitions (indices + metals).
#
# Each instrument derives a bias from macro FACTORS:
#   - category factors (growth/inflation/labour/monetary) read from the
#     instrument's HOME currency scorecard (build_payload category score_cell);
#   - real_yield reads the global US 10y real-yield momentum score (DFII10).
#
# RAW convention (same as the FX category scores and the raw real-yield score):
#   + = hawkish / strong economy / rising yield.
# `sign` is the multiplier turning that raw into the instrument's directional
# contribution; `weight` is the factor's weight in the weighted mean.
#
# Instrument score = weighted mean over PRESENT factors of (sign * raw) * scale,
# so a missing factor (e.g. real_yield when real_yields.parquet is empty, or a
# Monetary gap on a currency) is simply excluded — never zero-filled.
#
# bias_thresholds reuse the FX values (mild 1.3, very 3.0) as a PLACEHOLDER;
# recalibrated at 6.4.

scale: 5
bias_thresholds:
  mild: 2.0     # calibrated (6.4): ~p55 of |score| → ~50% Neutral
  very: 4.4     # calibrated (6.4): ~p90 of |score| → ~12% Very

# Reusable factor presets ------------------------------------------------------
# Indices: a strong economy / hawkish read is BULLISH for growth, but hot
# inflation, a hot labour market, hawkish monetary policy and rising real yields
# are BEARISH (tighter policy / higher discount rate).
# Metals (USD-denominated, US-macro-driven): everything that lifts the dollar /
# real yields weighs on gold & silver; growth carries a lighter (0.5) weight.
# No separate USD factor — the USD category scores already cover the dollar
# (avoids double-counting).

instruments:
  # --- Indices ---
  DJIA:
    type: index
    home_ccy: USD
    factors:
      growth:     { sign: 1,  weight: 1.0 }
      inflation:  { sign: -1, weight: 1.0 }
      labour:     { sign: -1, weight: 1.0 }
      monetary:   { sign: -1, weight: 1.0 }
      real_yield: { sign: -1, weight: 1.0 }
  SP500:
    type: index
    home_ccy: USD
    factors:
      growth:     { sign: 1,  weight: 1.0 }
      inflation:  { sign: -1, weight: 1.0 }
      labour:     { sign: -1, weight: 1.0 }
      monetary:   { sign: -1, weight: 1.0 }
      real_yield: { sign: -1, weight: 1.0 }
  NASDAQ:
    type: index
    home_ccy: USD
    factors:
      growth:     { sign: 1,  weight: 1.0 }
      inflation:  { sign: -1, weight: 1.0 }
      labour:     { sign: -1, weight: 1.0 }
