# Historical economic catalog — FAZA 1B.
#
# Populated EXCLUSIVELY from confirmed resolutions: FAZA 0 (candidate resolution
# against real data), FAZA 0.5 (POLICY-role band verification across all raw
# layers), FAZA 0.6 (label-mismatch inventory + live-replacement discovery),
# FAZA 1A (BLOCKED/STALE display thresholds, at the 4-point minimum — see
# "DECIZII LUATE" below, not the original 8-point FAZA 1A threshold). Nothing
# here is guessed or re-derived by fuzzy matching; every indicator_key was
# re-confirmed directly against data/economic_calendar_ff.parquet on 2026-08-20
# before this file was written. A slot with no confirmed resolution is OMITTED,
# never filled with a best-guess — see "OMITTED SERIES" at the bottom for the
# full list with reasons.
#
# Decisions carried forward, not renegotiated here (FAZA 1B brief):
#   - data_integrity.py is a DISPLAY-time filter only (build_quarantine_proposal),
#     never wired into to_scoring_frame / compute_indicator_score. Confirmed
#     zero measurable impact on today's scores (FAZA 1A) — the value is catalog
#     hygiene (depth/staleness/graph correctness), not score correction.
#   - Display windows: 1y / 2y / Max. Minimum 4 points (not FAZA 1A's original 8)
#     for a window to render; STALE (last print older than 2x empirical cadence)
#     blocks the whole series regardless of point count.
#   - LABEL_PENDING never blocks display — the corrected display_label below
#     (derived from the REAL name_raw, confirmed against the parquet) is used
#     directly; there is no "pending" state left at this layer.
#
# Schema per series entry:
#   indicator_key   — src/economic_compute.py / data/economic_indicators.yaml key.
#                     null only for a `policy` entry with no matching series
#                     (BAND_TEXT_ONLY, FAZA 0.5) — carries target_note instead.
#   role            — market | secondary | policy
#   rank            — display order within (category, currency)
#   display_label   — derived from the REAL name_raw feeding this key (FAZA 0.6
#                     Bloc D), NOT the canonical label where the two differ.
#   unit            — pct | level
#   transform_real  — MoM | QoQ | YoY | none — the series' ACTUAL transform,
#                     confirmed against name_raw (may differ from what the
#                     indicator_key's own name implies).
#   mismatch_note   — present only where display_label required a correction —
#                     what the canonical label said vs what the feed really is.
#   target_note     — (policy, BAND_TEXT_ONLY only) free-text target description;
#                     no series exists to plot a band, header text only.
#   target          — (policy, BAND_OK only) {kind: "point"|"band", value (point
#                     only), low/high (band only), effective_from, effective_to,
#                     source_note} — a point target (ECB/BoE) has one value; a
#                     band (RBA) has low/high. See "Policy targets" note at the
#                     bottom of this file for how each date was verified.

categories:

  inflation:
    USD:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: core_cpi
        role: secondary
        rank: 2
        display_label: "Core CPI (MoM)"
        unit: pct
        transform_real: MoM
        mismatch_note: "canonical label 'Core CPI y/y'; real feed (name_raw 'Core CPI m/m') is MoM"
      - indicator_key: null
        role: policy
        rank: 3
        # No matching series in the feed for this target — FAZA 0.5 Bloc B
        # confirmed headline PCE never appears in any local layer (parquet,
        # archive, jb_raw, ff_raw), only Core PCE m/m. Header text only, no band.
        target_note: "Fed: 2% headline PCE"

    EUR:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "CPI Flash Estimate (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: core_cpi
        role: secondary
        rank: 2
        display_label: "Core CPI Flash Estimate (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: cpi_yoy
        role: policy
        rank: 3
        display_label: "CPI Flash Estimate (YoY)"
        unit: pct
        transform_real: YoY
        # same series as the market entry above (BAND_OK, FAZA 0.5 Bloc B) —
        # label repeated here so a policy-band renderer doesn't need to cross-
        # reference the market entry just to know what it's plotting.
        target:
          kind: point
          value: 2.0
          effective_from: "2021-07-08"
          effective_to: null
          source_note: >-
            ECB Governing Council concluded its monetary policy strategy
            review adopting "a symmetric 2% inflation target over the medium
            term" (HICP). Announced 8 July 2021.
            https://www.ecb.europa.eu/press/pr/date/2021/html/ecb.pr210708~dc78cc4b0d.en.html

    GBP:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: core_cpi
        role: secondary
        rank: 2
        display_label: "Core CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: cpi_yoy
        role: policy
        rank: 3
        display_label: "CPI (YoY)"
        unit: pct
        transform_real: YoY
        target:
          kind: point
          value: 2.0
          effective_from: "2003-12-10"
          effective_to: null
          source_note: >-
            HM Treasury remit letter to the Bank of England Governor switched
            the target measure to CPI at 2% (from 2.5% RPIX), dated 10
            December 2003. Value unchanged since; the remit itself is
            re-issued (not re-valued) at each Budget.
            https://www.bankofengland.co.uk/letter/2003/chancellor-letter-101203

    JPY:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "National Core CPI (YoY)"
        unit: pct
        transform_real: YoY
        mismatch_note: >-
          canonical label 'CPI y/y' reads as headline; real feed (name_raw
          'National Core CPI y/y') is BOJ's ex-fresh-food core, not headline
          all-items — no headline CPI series exists in any local layer (FAZA 0.5/0.6).
      - indicator_key: tokyo_core_cpi_yoy
        role: secondary
        rank: 2
        display_label: "Tokyo Core CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: null
        role: policy
        rank: 3
        # No matching series — feed only provides the ex-fresh-food core
        # measure, used above as market/PRIM. Header text only, no band.
        target_note: "BoJ: 2%"

    CAD:
      - indicator_key: core_cpi
        role: market
        rank: 1
        display_label: "Median CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: trimmed_cpi_yoy
        role: secondary
        rank: 2
        display_label: "Trimmed CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: cpi_yoy
        role: secondary
        rank: 3
        display_label: "CPI (MoM)"
        unit: pct
        transform_real: MoM
        mismatch_note: "canonical label 'CPI y/y'; real feed (name_raw 'CPI m/m') is MoM"
      - indicator_key: null
        role: policy
        rank: 4
        # No clean matching series — this currency's cpi_yoy slot is MoM data
        # (see mismatch note above), core_cpi/trimmed_cpi_yoy are Median/
        # Trimmed core measures, not headline y/y. Header text only, no band.
        target_note: "BoC: 2%, band 1-3%"

    AUD:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "CPI (YoY)"
        unit: pct
        transform_real: YoY
      - indicator_key: trimmed_mean_cpi_monthly
        role: secondary
        rank: 2
        display_label: "Trimmed Mean CPI (MoM)"
        unit: pct
        transform_real: MoM
        # REPLACES the FAZA 0 candidate `core_cpi` (RBA Trimmed Mean CPI y/y,
        # quarterly): confirmed STALE (last print 2025-10-29, cadence quarterly,
        # >2x cadence old as of 2026-08-20) — ABS moved AUD's trimmed-mean
        # reporting to this monthly indicator (FAZA 0.6 C2/C3). n=6, real live
        # replacement, not a guess.
      - indicator_key: cpi_yoy
        role: policy
        rank: 3
        display_label: "CPI (YoY)"
        unit: pct
        transform_real: YoY
        target:
          kind: band
          low: 2.0
          high: 3.0
          effective_from: "1996-08-14"
          effective_to: null
          source_note: >-
            RBA "Statement on the Conduct of Monetary Policy", signed jointly
            with the incoming Treasurer, 14 August 1996 — adopted keeping
            underlying inflation between 2-3% on average over the cycle
            (reaffirmed in later joint Statements, band unchanged since).
            https://www.rba.gov.au/monetary-policy/framework/stmt-conduct-mp-1-14081996.html

    NZD:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "CPI (QoQ)"
        unit: pct
        transform_real: QoQ
        mismatch_note: "canonical label 'CPI y/y'; real feed (name_raw 'CPI q/q') is QoQ — no y/y series exists in any local layer"
      - indicator_key: null
        role: policy
        rank: 2
        # No matching series — feed only provides QoQ (see market slot above),
        # no y/y variant found anywhere locally. Header text only, no band.
        target_note: "RBNZ: 1-3%, focus 2%"

    CHF:
      - indicator_key: cpi_yoy
        role: market
        rank: 1
        display_label: "CPI (MoM)"
        unit: pct
        transform_real: MoM
        mismatch_note: "canonical label 'CPI y/y'; real feed (name_raw 'CPI m/m') is MoM — no y/y series exists in any local layer"
      - indicator_key: null
        role: policy
        rank: 2
        # No matching series — feed only provides MoM (see market slot above).
        # Header text only, no band.
        target_note: "SNB: 0-2%"

