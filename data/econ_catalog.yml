# -----------------------------------------------------------------------------
# Policy targets (FAZA 1C, Part 2; moved onto the market/secondary entries
# directly at FAZA 2C 4 — there is no more `policy` role anywhere in this
# catalog, inflation or otherwise; see the rates-category note above for why)
# — schema is `target: {kind: point|band, value|low/high, effective_from,
# effective_to, source_note, label}` on every currency where the target's own
# transform (always y/y) matches a series actually charted (EUR/GBP/AUD/USD
# market entries; CAD market+secondary; JPY market). `target_note` (free
# text, no chart overlay) covers every m/m or q/q series instead — a unit
# mismatch means the target can only ever be described, never drawn as a
# line/band on that chart (NZD/CHF market; USD's Core CPI MoM secondary).
# `comparable_with_target` (history_compute.build_payload, derived from
# transform_real=="YoY") is the runtime gate the UI actually checks before
# drawing anything — this section is the human-readable rationale behind it.
#
# `target.label`, where present, overrides the chart line/band's default
# "X% target" text — used wherever the currency's REAL target sits on a
# different underlying series than the one charted (Fed targets PCE not CPI;
# BoC/BoJ target headline CPI, not the core/median measures charted for
# CAD/JPY) — the chart says so directly rather than leaving that gap implicit.
# EUR/GBP/AUD carry no `label`: their charted series IS the formally targeted
# one, so there is no mismatch to name.
#
# All target dates verified against an official primary source (central-bank
# press release, remit letter, or FAQ — see each source_note) — not guessed.
# effective_to is null throughout: no subsequent reframing found for any of
# them as of 2026-08-25.
