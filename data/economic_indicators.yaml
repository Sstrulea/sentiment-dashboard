# Economic indicator taxonomy for the Economic Dashboard (v1).
#
# Drives src/economic_fetch.py (matcher → indicator_key) and
# src/economic_compute.py (scoring). Nothing here is hardcoded in Python —
# all thresholds, weights, directions, and pillar/category assignments live in
# this file.
#
# Scoring model (see DESIGN spec):
#   surprise = actual - consensus
#   z        = direction * surprise / sigma_rolling(last K prints, both values)
#   bucket z to integer score -2..+2 via z_buckets
#   fallback (< fallback_min_prints pairs, or sigma in {0, NaN}):
#       pct = direction * surprise / |consensus|, bucketed via pct_buckets
#   no consensus -> score 0, flag no_consensus.

defaults:
  surprise_window_k: 12        # rolling window (# of same-indicator prints) for sigma
  z_buckets: [1.54, 0.81]      # |z| >= 1.54 -> ±2 ; >= 0.81 -> ±1 ; else 0
  # Recalibrated C2 on the CLEAN |z| distribution (post zero-placeholder quarantine,
  # docs/zero-placeholder-quarantine.md): 1.54 = p87.5 (±2 catches ~12%), 0.81 = p60. The
  # earlier 1.71 was p87.5 of the CONTAMINATED distribution (fat tails from fake surprises).
  # Same pre-registered percentile, re-derived on clean data. Window/signs UNCHANGED.
  fallback_min_prints: 6       # below this many (actual,consensus) pairs, use pct fallback
  pct_buckets: [0.10, 0.02]    # |pct| >= 0.10 -> ±2 ; >= 0.02 -> ±1 ; else 0
  max_age_days: 120            # ultimate fallback when an indicator has no known frequency
  default_frequency: monthly   # used when an indicator declares no `frequency`
  # Recency window per frequency (~1.5x the cadence) so the latest print stays
  # "current" until the next one is due. A quarterly print (e.g. GDP) is NOT
  # dropped as stale just because it is >45d old.
  max_age_by_frequency:
    weekly: 14
    monthly: 45
    quarterly: 110
  # Flash/final collapse: consecutive prints of the SAME indicator closer than
  # this many days are one release event (flash + final of one period) → keep
  # only the later (final) so sigma isn't polluted by double prints.
  dedup_gap_days:
    weekly: 3
    monthly: 18
    quarterly: 45

# Equal-weight categories in v1 (1.0). The rate group cap is a Phase-7
# calibration concern and lives with the standing pillars (not in scope here).
categories:
  growth:    { weight: 1.0, label: "Growth" }
  inflation: { weight: 1.0, label: "Inflation" }
  labour:    { weight: 1.0, label: "Labour Market" }

# Each indicator:
#   pillar        — surprise pillar this belongs to (display grouping under category)
#   category      — growth | inflation | labour
#   direction     — +1 (higher actual = bullish for currency) | -1 (inverted)
#   weight        — relative weight within its category (equal=1.0 in v1)
#   max_age_days  — optional per-indicator override of defaults.max_age_days
#   currencies    — optional whitelist; absent => all in-scope currencies
#   frequency     — weekly | monthly | quarterly (drives the recency window +
#                   flash/final dedup gap). Defaults to defaults.default_frequency.
#   frequency_overrides — {CCY: frequency} where a currency's cadence differs
#                   (e.g. AU/NZ CPI are quarterly while most are monthly).
#   can_be_zero   — default FALSE. When FALSE, an actual==0.0 or consensus==0.0 is
#                   treated as a Forex-Factory "unreleased/missing" placeholder (a
#                   delayed/cancelled release, e.g. the Oct-2025 US shutdown) and is
#                   QUARANTINED to NaN at ingest so it never enters the z-baseline as a
#                   fake huge surprise. TRUE only where 0.0 is a legitimate reading:
#                   levels/rates/indices (unemployment, PMI, CPI-y/y, claims, jolts, adp)
#                   are FALSE; net changes / growth rates (employment_change,
#                   retail_sales, rate decisions) are TRUE.
indicators:
  # --- Inflation (hawkish convention: hotter = bullish currency) ---
  cpi_yoy:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    # AUD override REMOVED 2026-08 (fix/aud-cpi-frequency-override): ABS moved
    # AUD headline CPI y/y to monthly cadence — measured real median interval
    # over the last 12 raw prints is 28d, not the ~91d "quarterly" this
    # override claimed. With quarterly wrongly configured,
    # dedup_gap_days["quarterly"]=45d collapsed 44 raw rows to 2 (treating
    # consecutive monthly prints as flash/final of the same release), pushing
    # n below fallback_min_prints and producing a permanent `fallback`/z=None
    # badge despite 41 real (actual, consensus) pairs existing. NZD is
    # unaffected (measured ~91d, genuinely quarterly) and keeps its override.
    frequency_overrides: { NZD: quarterly }
  core_cpi:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    # AUD REMOVED 2026-08 (docs/board-data-loss-round3.md +
    # config/alert_exceptions.yaml): the mapped canonical, RBA Trimmed
    # Mean CPI y/y, is dead — ABS moved AUD CPI to monthly cadence, last
    # print 2025-10-29, will never print again under that name/cadence.
    # Numerically a no-op today (a stale slot already contributes
    # nothing to score_precise) — this removes a permanently-empty
    # slot, not a live one; AUD's replacement monthly CPI reporting is
    # now scored directly as cpi_monthly/trimmed_mean_cpi_monthly
    # above.
    #
    # NZD/CHF REMOVED 2026-08 (docs/empty-slot-routing-audit.md, Part A):
    # both were `no_data` — zero valid prints ever, confirmed by
    # exhaustive per-currency raw-name enumeration across parquet,
    # archive, and jb_raw (no core/trimmed CPI variant exists for either
    # under any name). Never had a matcher rule routing to core_cpi
    # either, so this is a no-op on scoring — it removes two
    # permanently-empty slots that were inflating configured coverage,
    # making the reported N honest.
    currencies: [USD, EUR, GBP, JPY, CAD]
  ppi_yoy:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    frequency_overrides: { AUD: quarterly, NZD: quarterly }
  core_pce:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: monthly

  # --- Growth ---
  gdp_qoq:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    frequency: quarterly       # GDP q/q is quarterly everywhere
    # CAD override ADDED 2026-08 (docs/diag-cad-gdp-fallback.md): CAD's
    # gdp_qoq is fed via config/ff_aliases.yaml's "GDP m/m": "GDP q/q" # xf
    # — genuinely monthly data (24-39d gaps), not quarterly. The static
    # `quarterly` frequency gave _dedup_flash_final a 45d dedup_gap, which
    # never sees a gap in CAD's real cadence, so the ENTIRE history
    # collapsed into one flash/final cluster: 42 rows -> 2 kept -> 1 with
    # a valid consensus -> n_pairs=1, sigma=nan, forced pct fallback,
    # saturating to +2 on an ordinary 0.1pp beat (25% of a 0.40 consensus).
    # The same data z-scores to sigma=0.109, z=0.923, score +1. This
    # override tells the engine CAD's true cadence; every other currency's
    # gdp_qoq (genuinely quarterly) is untouched.
    #
    # GBP override ADDED 2026-08 (FAZA 1E, docs/faza1e-report.md): same
    # mechanism, different matcher route. GBP's `gdp_qoq` is fed via this
    # file's own matcher (United Kingdom: '^GDP m/m$' -> gdp_qoq, added
    # 2026-06-11 — ONS discontinued "GDP q/q" in 2025-05, so the live scored
    # release is the monthly "GDP m/m" print) rather than config/ff_aliases.yaml,
    # but the downstream effect is identical: genuinely monthly data (median
    # gap 29d) has no usable MT5 `period` in this feed, so
    # `_dedup_flash_final` falls back to release-date proximity clustering —
    # and the static `quarterly` frequency's 45d dedup_gap never sees a gap
    # in GBP's real cadence, collapsing the ENTIRE history (44 rows) into a
    # single cluster -> 2 kept -> forced pct fallback, saturating an ordinary
    # -0.4pp miss on a -0.1 consensus (400%) to score -2. The same data
    # z-scores to z=-1.474, score -1. This override tells the engine GBP's
    # true cadence; every other currency's gdp_qoq (genuinely quarterly, or
    # CAD's already-declared monthly above) is untouched.
    frequency_overrides: { CAD: monthly, GBP: monthly }
  manufacturing_pmi:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    frequency: monthly
  services_pmi:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    frequency: monthly
    # JPY/CHF REMOVED 2026-08 (docs/empty-slot-routing-audit.md, Part A):
    # both `no_data` — zero valid prints ever. JPY's own matcher already
    # has an unreachable `services_pmi` rule (`^au Jibun Bank Services
    # PMI$`) but no raw event under any name ever aliases to it — Japan's
    # PMI coverage in this feed is Manufacturing-only. CHF has no
    # services-PMI-named raw event at all. Removing both is a no-op on
    # scoring (both already contributed 0 coverage); it makes configured
    # coverage match actual coverage for the currencies that remain.
    currencies: [USD, EUR, GBP, AUD, NZD, CAD]
  retail_sales:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    frequency: monthly
    frequency_overrides: { NZD: quarterly }   # NZ retail sales is quarterly
    can_be_zero: true            # m/m growth rate — 0.0 is a legitimate flat month

  # --- Growth, display-only slot — RETIRED 2026-07-30
  # (docs/proposal-aud-retail-continuation.md, docs/measurement-no-consensus-
  # slots.md §8): `retail_sales` above is now CONTINUED under "Household
  # Spending m/m" (matcher below repointed from household_spending -> retail_
  # sales) instead of feeding this separate, permanently weight-0 slot.
  # Definition kept (not deleted) for history/backfill-script reference, but
  # it has NO matcher rule anywhere below — permanently unreachable, never a
  # `per_cat` entry regardless. `category: growth_display` (a key NOT present
  # in `categories:`, so it can never become a `per_cat` key regardless of
  # weight) is the same isolation mechanism `inflation_display` uses.
  household_spending:
    pillar: growth
    category: growth_display
    direction: 1
    weight: 0.0
    frequency: monthly
    can_be_zero: true            # m/m growth rate, same type as retail_sales
                                  # above (which has this TRUE by the same
                                  # convention) — a net-change series, not a
                                  # level/index. The archive's one actual=0.0
                                  # (2025-10-02, this series' first print) has
                                  # no independent same-day cross-check to
                                  # confirm/rule out corruption the way the
                                  # trimmed_mean_cpi_monthly case did (that had
                                  # a same-day headline print to compare
                                  # against); the type-based convention is
                                  # what's driving this, not a verified-clean
                                  # print.

  # --- Labour ---
  employment_change:           # NFP (US) / Employment Change (AU,CA,NZ) / Claimant (UK)
    pillar: labour
    category: labour
    direction: 1
    weight: 1.0
    frequency: monthly
    frequency_overrides: { EUR: quarterly, NZD: quarterly }
    can_be_zero: true            # net jobs change — 0.0 is a legitimate reading
    # JPY/CHF REMOVED 2026-08 (docs/empty-slot-routing-audit.md, Part A):
    # both `no_data` — zero valid prints ever under any name (both track
    # only Unemployment Rate, no separate "change in employment" release).
    # No-op on scoring; makes configured coverage honest.
    currencies: [USD, EUR, GBP, AUD, NZD, CAD]
    # GBP polarity fix (fix/claimant-count-polarity, 2026-08): GBP's
    # employment_change is fed by "Claimant Count Change" (UK matcher rule
    # below), NOT a jobs-created series like every other currency mapped to
    # this key — it counts people newly CLAIMING unemployment benefits, so
    # fewer claimants = a stronger labour market = bullish GBP. Inverted vs.
    # NFP (USD)/Employment Change (AUD/CAD/NZD)/Flash Employment Change (EUR),
    # which all count jobs gained and are correctly direction:1 above.
    # `direction_overrides` is per-currency (mirrors frequency_overrides just
    # above), NOT a flip of the global `direction:` — that would silently
    # invert USD/AUD/CAD/NZD/EUR too. `direction_override_expect` is the
    # guard: if FF ever remaps the GBP employment_change matcher rule to a
    # different raw event name, compute_indicator_score refuses to apply this
    # override (quarantines the indicator instead of silently inverting
    # whatever now feeds this key) — see effective_direction/
    # direction_override_expect in src/economic_compute.py.
    direction_overrides: { GBP: -1 }
    direction_override_expect: { GBP: "Claimant Count Change" }
  unemployment_rate:
    pillar: labour
    category: labour
    direction: -1              # higher unemployment = bearish currency
    weight: 1.0
    frequency: monthly
    frequency_overrides: { NZD: quarterly }   # NZ unemployment is quarterly
  wage_growth:
    pillar: labour
    category: labour
    direction: 1
    weight: 1.0
    frequency: monthly         # US AHE / JP Labor Cash Earnings are monthly
    # EUR/CAD/CHF REMOVED 2026-08 (docs/empty-slot-routing-audit.md, Part
    # A): all three `no_data` — zero valid prints ever, no wage/earnings/
    # labour-cost series under any name (checked at EU-aggregate and every
    # carried EUR country level too). The EUR entry below is dropped from
    # frequency_overrides along with it — unreachable now that EUR is out
    # of the whitelist (`_indicator_applies` gates before
    # `effective_frequency` is ever consulted for an excluded currency),
    # not a separate threshold change. AUD/NZD keep their override,
    # unaffected. No-op on scoring; makes configured coverage honest.
    currencies: [USD, GBP, JPY, AUD, NZD]
    frequency_overrides: { AUD: quarterly, NZD: quarterly }
  adp:
    pillar: labour
    category: labour
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: monthly
  jolts:
    pillar: labour
    category: labour
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: monthly
  jobless_claims:
    pillar: labour
    category: labour
    direction: -1              # more claims = bearish currency
    weight: 1.0
    currencies: [USD]
    frequency: weekly

  # --- Rates (display-only; weight 0 to avoid double-counting vs the standing
  # Rate-Expectations pillar that is added in Phase 9) ---
  interest_rate_decision:
    pillar: rates
    category: rates
    direction: 1
    weight: 0.0
    frequency: monthly         # display-only; window only affects greying
    can_be_zero: true          # a policy rate / no-change decision can legitimately be 0

  # --- Inflation, PROMOTED 2026-08 (AUD only — docs/board-data-loss-
  # round3.md + PR #8's archive backfill landed both series at exactly
  # n=6, fallback_min_prints, z-scored not pct — confirmed via
  # compute_indicator_score before this change, not assumed). AUD's
  # quarterly `core_cpi` (RBA Trimmed Mean CPI y/y) is dead — ABS moved
  # AUD CPI to monthly cadence, last print 2025-10-29, see config/
  # alert_exceptions.yaml — and AUD `cpi_yoy` alone is a thin (single-
  # indicator) inflation category. These two ARE AUD's replacement
  # monthly CPI reporting (ABS's own Monthly CPI Indicator, headline and
  # trimmed-mean), not a proxy for something else.
  #
  # `currencies: [AUD]` is deliberate and load-bearing, not decorative:
  # neither indicator_key has a matcher rule under any OTHER country
  # block (verified — grep the `matcher:` section below, `indicator:
  # cpi_monthly` / `indicator: trimmed_mean_cpi_monthly` appear ONLY
  # under `Australia:`), so no other currency could ever populate these
  # keys regardless — this whitelist makes that structural fact
  # explicit and machine-enforced rather than incidental, so a future
  # alias/matcher addition for another currency can never silently
  # inherit AUD's weight/category by routing through the same key.
  cpi_monthly:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    currencies: [AUD]
  trimmed_mean_cpi_monthly:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    currencies: [AUD]
    # NO can_be_zero here, deliberately — do not add it. The 2026-07-29 print
    # shows actual=0.0, but FF itself published 0.3 that day; JBlanked's feed
    # delivered a corrupted 0.0 for this print (same-day pattern as the known
    # AUD CPI y/y 0.0-vs-3.8 corruption). This is bad SOURCE data, not a
    # legitimate flat month — can_be_zero would let a future corrupted 0.0
    # print silently past the zero-placeholder quarantine as if it were real.

  # --- Inflation, display-only (CAD's native BoC core-inflation measures —
  # Common/Median/Trimmed CPI y/y, config/ff_aliases.yaml). Same
  # `inflation_display` isolation as AUD's cpi_monthly above: this category
  # is NOT a key in `categories:`, so it never becomes a `per_cat` key
  # regardless of weight.
  # PROMOTED 2026-08 (CAD only — docs/empty-slot-routing-audit.md Part C +
  # docs/aud-inflation-independence-check.md for the methodology this
  # mirrors): n=43 valid scored prints, z-scored not pct (confirmed via
  # compute_indicator_score before this change, sigma=0.108). Release-date
  # independence checked first, per the AUD precedent: coincides with
  # CAD's scored cpi_yoy/core_cpi on ~100% of shared opportunities (43/43),
  # the large majority at an identical minute-level timestamp — the same
  # one-publication/complementary-measures structure the AUD promotion
  # relied on, not duplicate scoring of one reading. `currencies: [CAD]`
  # is deliberate and load-bearing: no matcher rule for common_cpi_yoy
  # exists under any other country block.
  common_cpi_yoy:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    currencies: [CAD]
  # PROMOTED 2026-08 (CAD only — same basis as common_cpi_yoy above): n=41
  # valid scored prints, z-scored not pct, sigma=0.100. Coincides with
  # CAD's scored cpi_yoy/core_cpi on ~100% of shared opportunities (41/41),
  # the large majority at an identical minute-level timestamp.
  # `currencies: [CAD]` is deliberate and load-bearing, same reasoning as
  # above.
  trimmed_cpi_yoy:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    frequency: monthly
    currencies: [CAD]
  # RETIRED as a display-only slot 2026-07-30 (docs/proposal-cad-core-
  # promotion.md, docs/measurement-no-consensus-slots.md §6): CAD's scored
  # `core_cpi` was permanently `no_consensus` (fed by "Core CPI m/m", wrong
  # unit, 0/54 forecasts ever) — median_cpi_yoy is now PROMOTED into that
  # slot instead (matcher below: Canada's `^Median CPI y/y$` -> core_cpi, the
  # old `^Core CPI y/y$` -> core_cpi rule removed). Definition kept (not
  # deleted) for history/backfill-script reference, but it has NO matcher
  # rule anywhere below — permanently unreachable, never a `per_cat` entry
  # regardless. Displaying the identical number twice (once scored as
  # core_cpi, once again here as inert display-only) would be redundant, not
  # useful — see docs/measurement-no-consensus-slots.md §6 backfill notes.
  # Reconfirmed 2026-08-18 (CAD inflation label-fix investigation): 0 rows
  # in the live scoring frame carry indicator_key=median_cpi_yoy — the
  # pattern that would feed it (`^Median CPI y/y$`) is at core_cpi instead
  # (see the Canada matcher block below).
  median_cpi_yoy:
    pillar: inflation
    category: inflation_display
    direction: 1
    weight: 0.0
    frequency: monthly

  # --- Bucket-C candidates, approved 2026-08-01 (all 17) — see
  # docs/bucket-c-merit-evaluation.md (merit, FAZA 1),
  # docs/bucket-c-impact-measurement.md (single-date impact, FAZA 2),
  # docs/bucket-c-panel-measurement.md (counterfactual frequency panel).
  # Direction is +1 for all 17 (every one was rated "clear, higher=bullish"
  # in FAZA 1 — none of the direction-ambiguous FAZA-1 "intreaba" candidates
  # are here). Scored (weight 1.0, real category), not display-only.
  tokyo_core_cpi_yoy:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    currencies: [JPY]
    frequency: monthly
  industrial_production_mm:            # USD/GBP headline + JPY flash (Prelim)
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [USD, GBP, JPY]
    frequency: monthly
  durable_goods_orders_mm:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: monthly
  core_machinery_orders_mm:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [JPY]
    frequency: monthly
  personal_spending_mm:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: monthly
  personal_income_mm:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: monthly
  import_prices:                       # USD m/m + AUD q/q
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    currencies: [USD, AUD]
    frequency: monthly
    frequency_overrides: { AUD: quarterly }
  capital_expenditure:                 # AUD Private Capex q/q + JPY Capital Spending q/y
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [AUD, JPY]
    frequency: quarterly
  company_operating_profits_qoq:
    pillar: growth
    category: growth
    direction: 1
    weight: 1.0
    currencies: [AUD]
    frequency: quarterly
  sppi_yoy:
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    currencies: [JPY]
    frequency: monthly
  gdp_price_index:                     # JPY Prelim y/y + USD Advance q/q (flash-scored)
    pillar: inflation
    category: inflation
    direction: 1
    weight: 1.0
    currencies: [USD, JPY]
    frequency: quarterly
  unit_labor_costs_qoq:
    pillar: labour
    category: labour
    direction: 1
    weight: 1.0
    currencies: [USD]
    frequency: quarterly

# ---------------------------------------------------------------------------
# Matcher: MT5 economic-calendar `event` string -> indicator_key, keyed by the
# MT5 `country` field. Reconciled against REAL event names observed in
# $MT5_FILES_DIR/economic_calendar.csv via `python -m src.economic_probe
# --dump-events` (540-day history). No longer UNVERIFIED.
#
# Rules:
#   * Entries are defined ONLY for the 8 in-scope countries. Euro-area member
#     states (Germany, France, Italy, Spain) are intentionally absent, so their
#     rows drop — EUR is scored exclusively from "European Union" releases,
#     avoiding triple-counting (e.g. national PMIs vs the EU aggregate).
#   * Patterns are anchored full-string regexes (^...$, case-insensitive) so
#     each indicator_key maps to EXACTLY ONE event name per country. This is
#     critical: m/m and y/y variants share a release timestamp, so collapsing
#     them under one key would corrupt the surprise/sigma series.
#   * S&P Global *Composite* PMI is deliberately NOT mapped (manufacturing +
#     services are already counted separately; composite would double-count).
#   * `interest_rate_decision` carries weight 0 (display-only).
#
# Evaluation: src.economic_fetch.match_event() walks this country's rule list
# in order and returns the indicator of the first pattern that matches.
# ---------------------------------------------------------------------------
matcher:
  United States:
    - { pattern: '^Core PCE Price Index y/y$',      indicator: core_pce }
    - { pattern: '^Core CPI y/y$',                  indicator: core_cpi }
    - { pattern: '^CPI y/y$',                       indicator: cpi_yoy }
    - { pattern: '^PPI y/y$',                       indicator: ppi_yoy }
    - { pattern: '^GDP q/q$',                       indicator: gdp_qoq }
    - { pattern: '^ISM Manufacturing PMI$',         indicator: manufacturing_pmi }
    - { pattern: '^ISM Non-Manufacturing PMI$',     indicator: services_pmi }
    - { pattern: '^Retail Sales m/m$',              indicator: retail_sales }
    - { pattern: '^Nonfarm Payrolls$',              indicator: employment_change }
    - { pattern: '^Unemployment Rate$',             indicator: unemployment_rate }
    - { pattern: '^Average Hourly Earnings y/y$',   indicator: wage_growth }
    - { pattern: '^ADP Nonfarm Employment Change$', indicator: adp }
    - { pattern: '^JOLTS Job Openings$',            indicator: jolts }
    - { pattern: '^Initial Jobless Claims$',        indicator: jobless_claims }
    - { pattern: '^Fed Interest Rate Decision$',    indicator: interest_rate_decision }
    # Bucket-C candidates, approved 2026-08-01.
    - { pattern: '^Industrial Production m/m$',     indicator: industrial_production_mm }
    - { pattern: '^Durable Goods Orders m/m$',      indicator: durable_goods_orders_mm }
    - { pattern: '^Personal Spending m/m$',         indicator: personal_spending_mm }
    - { pattern: '^Personal Income m/m$',           indicator: personal_income_mm }
