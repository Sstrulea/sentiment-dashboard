    estimates:
      - label: "Bank of Canada annual assessment, MPR April 2026 appendix"
        basis: nominal
        low: 2.25
        high: 3.25
        published: 2026-04-29
        quote: "The Canadian nominal neutral rate is estimated to be within the range of 2.25% to 3.25%, unchanged from that in the April 2025 Report."
        source: {url: "https://www.bankofcanada.ca/publications/mpr/mpr-2026-04-29/appendix/", page: "web page, 'Neutral rate'", retrieved: 2026-11-14}
        transcription: manual
    note: "the October 2026 MPR assumes the midpoint of the same range (PDF p. 22, printed p. 21: 'assumed to be at the midpoint of its estimated range of 2.25% to 3.25%')"

  AUD:
    status: filled
    flag: STAFF_ESTIMATE
    estimates:
      - {label: "TVP-VAR Model 1, 2026 Q2", basis: nominal, point: 4.193964989513948, published: 2026-11-03, source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/xlsx/smp-graph-data.xlsx", page: "sheet 'Financial Conditions', Graph 1.1 'Nominal Neutral Rate', column TVP-VAR Model 1, row 2026-06", retrieved: 2026-11-14}, transcription: file}
      - {label: "TVP-VAR Model 2, 2026 Q2", basis: nominal, point: 3.659528095190119, published: 2026-11-03, source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/xlsx/smp-graph-data.xlsx", page: "sheet 'Financial Conditions', Graph 1.1, column TVP-VAR Model 2, row 2026-06", retrieved: 2026-11-14}, transcription: file}
      - {label: "TVP-VAR Model 3, 2026 Q2", basis: nominal, point: 4.416598826587419, published: 2026-11-03, source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/xlsx/smp-graph-data.xlsx", page: "sheet 'Financial Conditions', Graph 1.1, column TVP-VAR Model 3, row 2026-06", retrieved: 2026-11-14}, transcription: file}
      - {label: "Semi-structural Model 1, 2026 Q2", basis: nominal, point: 3.32158218543885, published: 2026-11-03, source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/xlsx/smp-graph-data.xlsx", page: "sheet 'Financial Conditions', Graph 1.1, column Semi-structural Model 1, row 2026-06", retrieved: 2026-11-14}, transcription: file}
      - {label: "Semi-structural Model 2, 2026 Q2", basis: nominal, point: 3.169446731565178, published: 2026-11-03, source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/xlsx/smp-graph-data.xlsx", page: "sheet 'Financial Conditions', Graph 1.1, column Semi-structural Model 2, row 2026-06", retrieved: 2026-11-14}, transcription: file}
      - {label: "Semi-structural Model 3, 2026 Q2", basis: nominal, point: 3.02024403284537, published: 2026-11-03, source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/xlsx/smp-graph-data.xlsx", page: "sheet 'Financial Conditions', Graph 1.1, column Semi-structural Model 3, row 2026-06", retrieved: 2026-11-14}, transcription: file}
    quote: "Estimates of the neutral rate in Australia have increased over recent years to be above their pre-pandemic levels, partly reversing a long-run decline"
    quote_source: {url: "https://www.rba.gov.au/publications/smp/2026/nov/pdf/statement-on-monetary-policy-2026-11.pdf", page: "Box B, p. 29 (PDF p. 32)", retrieved: 2026-11-14}
