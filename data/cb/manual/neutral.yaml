# Neutral policy-rate estimates (stance phase S0a) - DATA, edited by hand only; validated at load
# (src/cb_datasets.validate_neutral). Nothing is computed here: real -> nominal (+ target) and the combination rules are
# in config/cb_stance.yaml (applied in phase S1). USD has no entry: its neutral is the longer-run dots of the Fed SEP
# (data/cb/projections.parquet).
#
# banks.<CCY>: status filled|pending|not_published; flag (= mandates.yaml neutral.flag)
#   estimates [{label, member (GBP), basis nominal|real, point | low/high, published, quote (<= 30 words),
#               source {url, page, retrieved}, transcription manual|file}]
#   pending:  reason + next_step;   not_published: evidence {url, page, retrieved, quote} + policy_quote
# GBP: every text on bankofengland.co.uk with an explicit number for neutral in the last 24 months (to 2026-11-14) is
# stored; the 12-month window is applied by S1. Searched: all 160 speeches of the BoE sitemap (Nov 2024 - Nov 2026) and the
# 16 Monetary Policy Summaries and minutes of the same period.

meta:
  version: 1
  updated: 2026-11-14

banks:
  EUR:
    status: filled
    flag: STAFF_ESTIMATE
    estimates:
      - label: "real r*, model estimates updated to end-2024 (dark blue and dark yellow intervals of Chart A)"
        role: primary
        basis: real
        low: -0.5
        high: 0.5
        published: 2025-02-13
        quote: "the most recent estimates of real r* span a range between -½% and +½%"
        source: {url: "https://www.ecb.europa.eu/press/economic-bulletin/focus/2025/html/ecb.ebbox202501_08~3be5a005f9.en.html", page: "Economic Bulletin 1/2025, box 'Natural rate estimates for the euro area', footnote 2", retrieved: 2026-11-14}
        transcription: manual
      - label: "nominal r*, the same measures"
        role: primary_nominal
        basis: nominal
        low: 1.75
        high: 2.25
        published: 2025-02-13
        quote: "the estimates of the nominal r* from the most recent interval range between 1¾% and 2¼%"
        source: {url: "https://www.ecb.europa.eu/press/economic-bulletin/focus/2025/html/ecb.ebbox202501_08~3be5a005f9.en.html", page: "Economic Bulletin 1/2025, box 'Natural rate estimates for the euro area', footnote 4", retrieved: 2026-11-14}
        transcription: manual
      - label: "real r* including the three HLW-type estimates"
        role: alternative
        basis: real
        low: -0.5
        high: 1.0
        published: 2025-02-13
        quote: "When the three estimates derived from versions of the HLW model are factored in, the range of real r* is -½% to 1%"
        source: {url: "https://www.ecb.europa.eu/press/economic-bulletin/focus/2025/html/ecb.ebbox202501_08~3be5a005f9.en.html", page: "Economic Bulletin 1/2025, box 'Natural rate estimates for the euro area', footnote 2", retrieved: 2026-11-14}
        transcription: manual
    note: "latest ECB staff estimate with explicit numbers; no 2026 update found on ecb.europa.eu (searched 2026-11-14): older than the 15-month staleness limit"

  GBP:
    status: filled
    flag: MEMBERS_VIEW
    estimates:
      - label: "Alan Taylor, speech at Leeds University (Inflation dynamics and outlook)"
        member: Alan Taylor
        basis: real
        point: 0.75
        published: 2025-01-15
        quote: "Taking from among these 0.75% as a central estimate of r*, and adding the inflation target of 2%"
        source: {url: "https://www.bankofengland.co.uk/speech/2025/january/alan-taylor-speech-at-leeds-university-inflation-dynamics-and-outlook", page: "web page", retrieved: 2026-11-14}
        transcription: manual
      - label: "Alan Taylor, panellist at the ECB Forum on Central Banking 2025"
        member: Alan Taylor
        basis: nominal
        low: 2.75
        high: 3.0
        published: 2025-07-02
        quote: "I estimate the UK neutral real rate to be about 0.75 to 1 percent, putting the neutral nominal rate at around 2.75 to 3 percent"
        source: {url: "https://www.bankofengland.co.uk/speech/2025/july/alan-taylor-panellist-at-ecb-forum-on-central-banking-2025", page: "web page", retrieved: 2026-11-14}
        transcription: manual
      - label: "Alan Taylor, Monetary Policy Summary December 2025 (member paragraph)"
        member: Alan Taylor
        basis: nominal
        point: 3.0
        published: 2025-12-18
        quote: "I see neutral at about 3%."
        source: {url: "https://www.bankofengland.co.uk/monetary-policy-summary-and-minutes/2025/december-2025", page: "web page, Alan Taylor's paragraph", retrieved: 2026-11-14}
        transcription: manual
      - label: "Dave Ramsden, Monetary Policy Summary February 2026 (member paragraph)"
        member: Dave Ramsden
        basis: nominal
        point: 3.0
        published: 2026-02-05
        quote: "with my starting point for an estimate of the neutral rate of around 3%, I judge that policy should be less restrictive"
        source: {url: "https://www.bankofengland.co.uk/monetary-policy-summary-and-minutes/2026/february-2026", page: "web page, Dave Ramsden's paragraph", retrieved: 2026-11-14}
        transcription: manual
      - label: "Alan Taylor, Monetary Policy Summary April 2026 (member paragraph)"
        member: Alan Taylor
        basis: nominal
        point: 3.0
        published: 2026-04-30
        quote: "Given neutral at 3%, it makes sense to hold"
        source: {url: "https://www.bankofengland.co.uk/monetary-policy-summary-and-minutes/2026/april-2026", page: "web page, Alan Taylor's paragraph", retrieved: 2026-11-14}
        transcription: manual
      - label: "Alan Taylor, speech 'Central reservations' (Barclays and CEPR)"
        member: Alan Taylor
        basis: nominal
        point: 3.0
        published: 2026-06-23
        quote: "UK nominal neutral rate of 3% (see Annex 1 of the November 2025 Monetary Policy Report ). This level equates with my own central estimate of neutral"
        source: {url: "https://www.bankofengland.co.uk/speech/2026/june/alan-taylor-speech-at-the-barclays-and-centre-for-economic-policy-research", page: "web page", retrieved: 2026-11-14}
        transcription: manual
      - label: "Alan Taylor, Monetary Policy Summary September 2026 (member paragraph)"
        member: Alan Taylor
        basis: nominal
        point: 3.0
        published: 2026-09-17
        quote: "Bank Rate remains materially above my estimate of neutral at 3%"
        source: {url: "https://www.bankofengland.co.uk/monetary-policy-summary-and-minutes/2026/september-2026", page: "web page, Alan Taylor's paragraph", retrieved: 2026-11-14}
        transcription: manual
      - label: "Alan Taylor, speech 'Searching for signposts'"
        member: Alan Taylor
        basis: nominal
        low: 2.75
        high: 3.0
        published: 2026-09-29
        quote: "remain substantially restrictive relative to my estimate of nominal R*, of 2.75% to 3%"
        source: {url: "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", page: "web page", retrieved: 2026-11-14}
        transcription: manual
    excluded:
      - label: "Catherine L Mann, speech at Leeds Beckett University (11 February 2025), footnote"
        url: "https://www.bankofengland.co.uk/speech/2025/february/catherine-l-mann-speech-at-leeds-beckett-university-economic-prospects"
        quote: "At the time, long-term R* was estimated to have to fallen to around 0-1% with a most likely estimate of ¼ percent in real terms."
        reason: "describes an estimate 'at the time' (a past estimate in a footnote), not the member's current view"
      - label: "Bank staff (COMPASS) central estimate of 3% nominal, cited in Alan Taylor's June 2026 speech"
        url: "https://www.bankofengland.co.uk/speech/2026/june/alan-taylor-speech-at-the-barclays-and-centre-for-economic-policy-research"
        quote: "now embeds the staff's assessment of a central estimate of the UK nominal neutral rate of 3%"
        reason: "a staff estimate, not a member's view (flag MEMBERS_VIEW); the MPR Annex it cites (November 2025) was not transcribed"
    note: "only two members gave a number in 24 months (Taylor 7 times, Ramsden once); within the last 12 months: Taylor x5, Ramsden x1"

