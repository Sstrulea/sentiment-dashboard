# Mandates of the 8 central banks (stance phase S0a) - DATA with sources, not config. Edited by hand only.
# Nothing writes this file automatically: the framework watch (config/cb_framework.yaml) only DETECTS a change; the new
# version is added here after verification, with its source. Validated at load (src/cb_datasets.validate_mandates).
#
# banks.<CCY>.versions[] - versioned; exactly one version is current at a date; future versions already published are
# allowed (CAD 2027); historical versions for replay are phase S0b.
#   effective_from / effective_to (null = open)   change_reason bank_framework | bank_measures | dashboard_choice
#   target     {kind point|band, value | low/high, midpoint (only when the bank declares it: {value, quote}), measure}
#   mandate    {type price_stability|dual|hierarchical, quote}
#   horizon    {text, forward_looking, quote}
#   headline   series_id (config/cb_official.yaml macro) of the measure the target is defined on
#   underlying {primary (series id, or a list combined by `combine`), secondary[], rule_applied (1|2|3 of
#              config/cb_stance.yaml underlying_rule), evidence_url}
#   slack      {type unemployment_gap|output_gap|none, source}
#   neutral    {source fed_sep|manual, flag BANK_ESTIMATE|STAFF_ESTIMATE|SEP_LONGER_RUN|MEMBERS_VIEW|NOT_PUBLISHED}
#   forecasts  {source fed_sep|manual, conditioning own_path|market|constant_rate|unpublished}
#   sources    [{title, url, page, retrieved}]     last_verified {date, checked [url]}
#   corrections [{date, field, from, to, reason, source {url, page, retrieved}}] - a CORRECTION of our own classification is
#              edited in the current version and logged here; a NEW version is added only for a real change at the bank
#              (ARCHITECTURE section 23, "corectura vs schimbare").
# Every quote was re-read in the source on the retrieval date (transcription: manual).

meta:
  version: 1
  updated: 2026-11-14
  transcription: manual

banks:
  USD:
    versions:
      - effective_from: 2025-08-22
        effective_to: null
        change_reason: bank_framework
        target: {kind: point, value: 2.0, measure: "PCE price index, annual change"}
        mandate:
          type: dual
          quote: "statutory mandate from Congress of promoting maximum employment, stable prices, and moderate long-term interest rates"
        horizon:
          text: "over the longer run"
          forward_looking: true
          quote: "inflation at the rate of 2 percent, as measured by the annual change in the price index for personal consumption expenditures, is most consistent over the longer run"
        headline: fred:PCEPI
        underlying:
          primary: fred:PCEPILFE
          secondary: []
          rule_applied: 2
          evidence_url: "https://www.federalreserve.gov/monetarypolicy/fomcprojtabl20260916.htm"
          note: "the SEP projects core PCE inflation (rule 2); the Fed designates no official core measure"
        slack: {type: unemployment_gap, source: "fred:UNRATE minus the median longer-run unemployment rate of the latest SEP (data/cb/projections.parquet)"}
        neutral: {source: fed_sep, flag: SEP_LONGER_RUN}
        forecasts: {source: fed_sep, conditioning: own_path}
        sources:
          - {title: "Statement on Longer-Run Goals and Monetary Policy Strategy (adopted effective January 24, 2012; as reaffirmed effective January 27, 2026)", url: "https://www.federalreserve.gov/monetarypolicy/files/FOMC_LongerRunGoals.pdf", page: "p. 1-2", retrieved: 2026-11-14}
          - {title: "Review of Monetary Policy Strategy, Tools, and Communications (On August 22, 2025, the FOMC released a revised Statement)", url: "https://www.federalreserve.gov/monetarypolicy/review-of-monetary-policy-strategy-tools-and-communications.htm", page: "web page, 2025 Review: Overview", retrieved: 2026-11-14}
        last_verified:
          date: 2026-11-14
          checked: ["https://www.federalreserve.gov/monetarypolicy/files/FOMC_LongerRunGoals.pdf", "https://www.federalreserve.gov/monetarypolicy/fomcprojtabl20260916.htm"]

