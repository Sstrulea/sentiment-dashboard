# Central bank policy rates for the Carry page (/carry) — fetched
# automatically from BIS (src.policy_rate_fetch + src.policy_rate_sources),
# once a day. A manual edit here will be OVERWRITTEN by the next automated
# run; to correct a value, fix it at the source or adjust the fetch, not
# this file. See src.policy_rate_probe for the diagnostic that validated
# this design (dataflow, conventions, change-date accuracy) before it shipped.
#
#   rate_pct    — BIS's latest valid observation, in percent.
#   effective   — date of the last VALUE CHANGE BIS shows — NOT the date of
#                 the latest observation. Those differ whenever a rate has
#                 been held since before the fetch's lookback window; when
#                 that happens this keeps whatever `effective` was already
#                 on file rather than guessing.
#   verified    — date of the latest valid BIS observation behind rate_pct.
#                 src.carry_compute flags a row `stale` once this is older
#                 than meta.stale_after_days.
#   source_name — "BIS Central bank policy rates (<central bank, BIS's own
#                 SOURCE_REF>)".
#   source_url  — https://data.bis.org/topics/CBPOL
#
# A currency BIS didn't resolve on a given run keeps its previous entry
# untouched — see merge_rates() in src/policy_rate_fetch.py.
meta:
  stale_after_days: 45

rates:
  USD: {rate_pct: 3.625, effective: 2025-12-11, verified: 2026-08-25, source_name: "BIS Central bank policy rates (US Federal Reserve System)", source_url: "https://data.bis.org/topics/CBPOL"}
  EUR: {rate_pct: 2.25, effective: 2026-06-17, verified: 2026-08-25, source_name: "BIS Central bank policy rates (European Central Bank)", source_url: "https://data.bis.org/topics/CBPOL"}
  GBP: {rate_pct: 3.75, effective: 2025-12-18, verified: 2026-08-24, source_name: "BIS Central bank policy rates (Bank of England)", source_url: "https://data.bis.org/topics/CBPOL"}
  JPY: {rate_pct: 1.0, effective: 2026-06-17, verified: 2026-08-25, source_name: "BIS Central bank policy rates (Bank of Japan)", source_url: "https://data.bis.org/topics/CBPOL"}
  AUD: {rate_pct: 4.35, effective: 2026-05-06, verified: 2026-08-06, source_name: "BIS Central bank policy rates (Reserve Bank of Australia)", source_url: "https://data.bis.org/topics/CBPOL"}
  NZD: {rate_pct: 2.5, effective: 2026-07-09, verified: 2026-08-21, source_name: "BIS Central bank policy rates (Reserve Bank of New Zealand)", source_url: "https://data.bis.org/topics/CBPOL"}
