name: econ-refresh
# Started by the Cloudflare Worker in infra/cb-trigger (phase 4): every hour at :05 on weekdays, every 4 hours at the weekend. The GitHub schedule is only the backup for when the
# Worker is down: it runs less often, and its `guard` job skips it when a run started by the Worker succeeded recently (no needless double runs).
on:
  schedule:
    - cron: '35 6,18 * * 1-5'              # backup only, twice a day; runs only when the Worker's :05 run of the last hour did not succeed
    - cron: '35 12 * * 0,6'
  workflow_dispatch:
    inputs:
      render_all:
        description: "After the refresh, re-render EVERY page from the data on disk (keeps shared assets such as the navbar in sync across all pages); no extra fetch"
        type: boolean
        default: false

concurrency:
  group: econ-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Backup schedule only: skipped when a run started by the Worker (a dispatch) succeeded recently (2 hours on a weekday, 5 at the weekend). A dispatch or a failed check never skips anything.
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read                        # gh run list
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hours=$([ "$(date -u +%u)" -ge 6 ] && echo 13 || echo 1)      # weekday: the :05 run of this hour; weekend: the Worker runs every 12 h
          since=$(date -u -d "$hours hours ago" +%FT%TZ)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow econ-refresh.yml --status success --created ">=$since" --json event -q '[.[] | select(.event == "workflow_dispatch")] | length') || n=0
          echo "recent successful dispatch runs (last $hours h): $n"
          echo "skip=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Calendar FF
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # FRED only through the API with a key (src/fred_api.py)
        run: python -m src.ff_refresh

      - name: Actuals JBlanked
        env:
          JBLANKED_API_KEY: ${{ secrets.JBLANKED_API_KEY }}
        run: python -m src.jb_actuals

      # Display-only official series (data/official_series.parquet). Zero requests unless an
      # FF anchor's quarter is missing; guarded (G1/G2), append-only; always exits 0.
      - name: Official series (Stats NZ)
        # the fetcher always exits 0, but an import error must never stop FRED/render/commit
        continue-on-error: true
        timeout-minutes: 3
        run: python -m src.official_fetch

      # Daily series (2y yields, real yields, liquidity): one fetch a day, after 21:00 UTC (state data/daily_gate.json) - fix/sources-compliance
      - name: FRED due today?
        id: fredgate
        run: echo "run=$(python -m src.daily_gate check fred --after 21:00)" >> "$GITHUB_OUTPUT"

      - name: FRED
        if: steps.fredgate.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # FRED only through the API with a key (src/fred_api.py)
        run: |
          python -m src.rate_fetch
          python -m src.realyield_fetch
          python -m src.liquidity_fetch
          python -m src.daily_gate mark fred

      # Render only when a data file changed (or render_all): an unchanged hour costs no render
      - name: Data changed?
        id: changed
        run: echo "changed=$([ -n "$(git status --porcelain data/)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Render
        if: steps.changed.outputs.changed == 'true' || inputs.render_all
        run: python -m src.main --mode economic

      # Dispatch-only: `python -m src.main --mode render-all` (COT, P/C, VIX, retail, economic, carry, strength, history) so a shared template
      # change (the navbar) reaches every page without waiting for each pipeline's own schedule. Committed below with the rest of public/.
      - name: Render all pages (navbar sync)
        if: inputs.render_all
        run: python -m src.main --mode render-all

      - name: Commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic_calendar_ff.parquet data/jb_last_pull.json data/ff_last_refresh.json \
                  data/jb_raw/ data/ff_raw/ \
                  data/rates.parquet data/real_yields.parquet data/net_liquidity.parquet \
                  public/
          [ -f data/ff_quarantine.parquet ] && git add data/ff_quarantine.parquet || true
          [ -f data/integrity_report.json ] && git add data/integrity_report.json || true
          [ -f data/rates_gap_state.json ] && git add data/rates_gap_state.json || true
          [ -f data/official_series.parquet ] && git add data/official_series.parquet || true
          [ -f data/daily_gate.json ] && git add data/daily_gate.json || true
          git diff --cached --quiet && { echo "nimic de comis"; exit 0; }
          git commit -m "econ: refresh $(date -u +%FT%TZ) [ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
