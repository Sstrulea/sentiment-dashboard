name: econ-refresh
# Started by the Cloudflare Worker in infra/cb-trigger (phase 4): every hour at :05 on weekdays, every 4 hours at the weekend. The GitHub schedule is only the backup for when the
# Worker is down: it runs less often, and its `guard` job skips it when a run started by the Worker succeeded recently (no needless double runs).
on:
  schedule:
    - cron: '35 */3 * * 1-5'               # backup only; off the Worker's :05
    - cron: '35 */6 * * 0,6'
  workflow_dispatch:
    inputs:
      render_all:
        description: "After the refresh, re-render EVERY page from the data on disk (keeps shared assets such as the navbar in sync across all pages); no extra fetch"
        type: boolean
        default: false

concurrency:
  group: econ-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Backup schedule only: skipped when a run started by the Worker (a dispatch) succeeded recently (2 hours on a weekday, 5 at the weekend). A dispatch or a failed check never skips anything.
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read                        # gh run list
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hours=$([ "$(date -u +%u)" -ge 6 ] && echo 5 || echo 2)
          since=$(date -u -d "$hours hours ago" +%FT%TZ)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow econ-refresh.yml --status success --created ">=$since" --json event -q '[.[] | select(.event == "workflow_dispatch")] | length') || n=0
          echo "recent successful dispatch runs (last $hours h): $n"
          echo "skip=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Calendar FF
        run: python -m src.ff_refresh

      - name: Actuals JBlanked
        env:
          JBLANKED_API_KEY: ${{ secrets.JBLANKED_API_KEY }}
        run: python -m src.jb_actuals

      - name: FRED
        run: |
          python -m src.rate_fetch
          python -m src.realyield_fetch
          python -m src.liquidity_fetch

      - name: Render
        run: python -m src.main --mode economic

      # Dispatch-only: `python -m src.main --mode render-all` (COT, P/C, VIX, retail, economic, carry, strength, history) so a shared template
      # change (the navbar) reaches every page without waiting for each pipeline's own schedule. Committed below with the rest of public/.
      - name: Render all pages (navbar sync)
        if: inputs.render_all
        run: python -m src.main --mode render-all

      - name: Commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic_calendar_ff.parquet data/jb_last_pull.json data/ff_last_refresh.json \
                  data/jb_raw/ data/ff_raw/ \
                  data/rates.parquet data/real_yields.parquet data/net_liquidity.parquet \
                  public/
          [ -f data/ff_quarantine.parquet ] && git add data/ff_quarantine.parquet || true
          git diff --cached --quiet && { echo "nimic de comis"; exit 0; }
          git commit -m "econ: refresh $(date -u +%FT%TZ) [ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
