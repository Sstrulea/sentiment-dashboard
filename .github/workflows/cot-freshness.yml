name: COT freshness check

on:
  schedule:
    - cron: '0 10 * * 6'   # Saturday 10:00 UTC, after the Friday/Saturday runs
    - cron: '0 23 * * 2'   # Tuesday 23:00 UTC, after the holiday-delay runs
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/check_cot_freshness.py
      - name: Open issue on stale/failed check
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "COT data stale",
              body: `Freshness check failed. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
