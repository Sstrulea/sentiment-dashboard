name: COT freshness check

on:
  schedule:
    - cron: '37 9 * * 0'
  workflow_dispatch:
  push: # TEMP: branch-testing only, removed in TASK C
    branches: [feat/cot-freshness-check]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: TEMP - build truncated parquet for failure-path test
        run: |
          python -c "
          import pandas as pd
          df = pd.read_parquet('data/history.parquet')
          stale = df[df['report_date_as_yyyy_mm_dd'] <= '2026-08-25']
          stale.to_parquet('/tmp/truncated_history.parquet')
          "
          echo "TEMP_TEST_PARQUET=/tmp/truncated_history.parquet" >> "$GITHUB_ENV"
      - run: python scripts/check_cot_freshness.py "$TEMP_TEST_PARQUET" # TEMP: points at truncated copy, removed in TASK C
      - name: Open issue on stale/failed check
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "COT data stale",
              body: `Freshness check failed. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
