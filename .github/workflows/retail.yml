name: Retail Sentiment Refresh

# DISABLED 2026-11-16 (fix/sources-compliance, George's decision): the retail collection (Myfxbook) is stopped. No schedule; the
# job never runs (if: false), even when dispatched by hand. The code, data/retail_*.parquet and the page stay; the page stays hidden.
on:
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  retail:
    if: false                                  # collection stopped (see the header)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retail snapshot
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python -m src.main --mode retail

      - name: Commit and push if changes
        run: |
          git config user.name "sstrulea"
          git config user.email "sebi.strulea@gmail.com"
          git add data/retail_history.parquet data/retail_general.parquet \
                  public/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "retail: snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push
          fi
