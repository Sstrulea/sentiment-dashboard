name: Weekly COT Update
on:
  # CFTC publishes Friday 15:30 ET (19:30 UTC summer, 20:30 UTC winter). Friday
  # evening, a Saturday morning retry, and Monday/Tuesday evenings for releases
  # delayed by US holidays (the 16 and 30 Jun 2026 reports never reached the page).
  # A run that finds no new report and no revision exits 0 without committing.
  schedule:
    - cron: '20 21 * * 5'   # Friday 21:20 UTC
    - cron: '20 8 * * 6'    # Saturday 08:20 UTC
    - cron: '20 21 * * 1,2' # Monday and Tuesday 21:20 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m src.main
      - name: Commit updated data and HTML
        run: |
          git config user.name "sstrulea"
          git config user.email "sebi.strulea@gmail.com"
          git add data/history.parquet data/cot_meta.json public/
          git diff --staged --quiet || git commit -m "Weekly update $(date -u +%Y-%m-%d)"
          git push
