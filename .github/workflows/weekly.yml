name: Weekly COT Update
on:
  schedule:
    - cron: '0 4 * * 0'   # Sunday 04:00 UTC = 06:00-07:00 Romania
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m src.main
      - name: Commit updated data and HTML
        run: |
          git config user.name "sstrulea"
          git config user.email "sebi.strulea@gmail.com"
          git add data/history.parquet public/
          git diff --staged --quiet || git commit -m "Weekly update $(date -u +%Y-%m-%d)"
          git push
