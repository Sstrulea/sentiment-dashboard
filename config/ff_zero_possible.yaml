# zero_possible per mapped FF series (canonical_id) — audit 2026-09-23, Z1.
# EXPLICIT for every series the matcher maps (tests/test_zero_possible.py enforces it);
# there is no default: an unlisted mapped series raises in ff_scoring.
#   false  levels and indices (PMI, unemployment rate, claims, JOLTS): a 0.0 is always
#          JBlanked's placeholder.
#   true   m/m, q/q, y/y, 3m/y, q/y changes and net changes (employment change,
#          claimant count, ADP, NFP): 0.0 is a real print unless the newest JB payload
#          said "Data Not Loaded" or the next print's `previous` contradicts it (Z2).
#          interest_rate_decision is true on purpose: a 0.00% policy rate is a real level
#          (SNB 2025); the displayed rate comes from data/cb/decisions.parquet anyway.
zero_possible:
  # --- false: levels / indices
  aud_s_p_global_manufacturing_pmi: false   # manufacturing_pmi: Flash Manufacturing PMI
  aud_s_p_global_services_pmi: false   # services_pmi: Flash Services PMI
  aud_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  cad_s_p_global_manufacturing_pmi: false   # manufacturing_pmi: Manufacturing PMI
  cad_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  chf_procure_ch_manufacturing_pmi: false   # manufacturing_pmi: Manufacturing PMI
  chf_procurech_manufacturing_pmi: false   # manufacturing_pmi: Manufacturing PMI
  chf_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  eur_s_p_global_manufacturing_pmi: false   # manufacturing_pmi: Flash Manufacturing PMI
  eur_s_p_global_services_pmi: false   # services_pmi: Flash Services PMI
  eur_sp_global_manufacturing_pmi: false   # manufacturing_pmi: Final Manufacturing PMI
  eur_sp_global_services_pmi: false   # services_pmi: Final Services PMI
  eur_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  gbp_s_p_global_cips_manufacturing_pmi: false   # manufacturing_pmi: Final Manufacturing PMI
  gbp_s_p_global_cips_services_pmi: false   # services_pmi: Final Services PMI
  gbp_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  jpy_au_jibun_bank_manufacturing_pmi: false   # manufacturing_pmi: Flash Manufacturing PMI
  jpy_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  nzd_businessnz_manufacturing_index: false   # manufacturing_pmi: BusinessNZ Manufacturing Index
  nzd_businessnz_services_index: false   # services_pmi: BusinessNZ Services Index
  nzd_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  usd_initial_jobless_claims: false   # jobless_claims: Unemployment Claims
  usd_ism_manufacturing_pmi: false   # manufacturing_pmi: ISM Manufacturing PMI
  usd_ism_non_manufacturing_pmi: false   # services_pmi: ISM Services PMI
  usd_jolts_job_openings: false   # jolts: JOLTS Job Openings
  usd_unemployment_rate: false   # unemployment_rate: Unemployment Rate
  # --- true: changes / net changes / policy rate
  aud_company_operating_profits: true   # company_operating_profits_qoq: Company Operating Profits q/q
  aud_cpi: true   # cpi_yoy: CPI y/y
  aud_employment_change: true   # employment_change: Employment Change
  aud_gdp: true   # gdp_qoq: GDP q/q
  aud_household_spending: true   # retail_sales: Household Spending m/m
  aud_import_prices: true   # import_prices: Import Prices q/q
  aud_monthly_cpi_indicator: true   # cpi_monthly: CPI m/m
  aud_monthly_trimmed_mean_cpi: true   # trimmed_mean_cpi_monthly: Trimmed Mean CPI m/m
  aud_ppi: true   # ppi_yoy: PPI q/q
  aud_private_capital_expenditure: true   # capital_expenditure: Private Capital Expenditure q/q
  aud_rba_interest_rate_decision: true   # interest_rate_decision: Cash Rate
