# Pipeline source switch (Phase 3). Rollback = set calendar_source back to 'mt5'.
#   ff  -> economic calendar comes from Forex Factory (src/econ_calendar_ff + ff_refresh)
#   mt5 -> economic calendar comes from the MT5 EA CSV (src/economic_fetch) [quarantined]
# MT5 remains the source for OHLC/trend regardless; FRED remains rates/liquidity.
calendar_source: ff

# FF weekly feed (keyless, public). Fetched each economic-cron tick.
ff_weekly_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
# Optional throttle: skip a fetch if the last successful one was newer than this
# (0 = fetch every tick; the cron cadence itself is unchanged/hourly).
ff_fetch_interval_minutes: 0
# Anti-degradation sanity: a good weekly payload must map events for >= this many
# distinct currencies, else it is quarantined and the last-good parquet is kept.
ff_min_currencies: 4

# FRED cross-check (Phase 3 Task 2) tolerance in pp for US actuals.
fred_crosscheck_tol_pp: 0.15

# JBlanked daily actuals pull — the weekly feed above is STRUCTURALLY actual-less
# (schedule + forecast only), so actuals come from JBlanked. Since 2026-10-02 the
# free daily request covers ONLY /calendar/today/ (range answers 401 "requires
# credits"), so the pull (python -m src.jb_actuals) makes ONE attempt per day at the
# first tick after 20:30 UTC and never retries, whatever the outcome; every attempt
# is recorded in data/jb_last_pull.json, its body in data/jb_raw/jb_today_*.json.
# Auth: JBLANKED_API_KEY (never call during dev/tests). jb_today_not_before holds
# the first call back (the range retries of 2026-10-07 may have spent that day's request).
jb_today_url: "https://www.jblanked.com/news/api/forex-factory/calendar/today/"
jb_today_not_before: "2026-10-08T20:30:00"
# range endpoint (paid credits) — kept for the code path, NOT called.
jb_range_url: "https://www.jblanked.com/news/api/forex-factory/calendar/range/"

# TREND kill switch (Faza B, docs/accepted-degradations.md). Rollback = set this
# back to true, mirroring calendar_source's ff/mt5 switch above. Default false:
# TREND is disabled — src.economic_render never calls trend_score_all(), no
# instrument (FX or cross-asset) carries a trend/trend_detail key, no TREND
# column/group/modal-row anywhere in the UI, and the "price" freshness watch
# (MT5 price_history.parquet — TREND's only consumer) is skipped. Scores
# renormalize to FUND + SENTIMENT only. Reason: the MT5 price feed dependency
# (Wine-only, Mac-only, no cloud path) — see docs/accepted-degradations.md.
trend_enabled: false
