# Freshness-alert exceptions (docs/proposal-alert-suppression.md, Option A).
#
# Suppresses a KNOWN, documented, currently-unfixed staleness from the
# exit-1 gate — never silently forever: `review_by` is ENFORCED (checked
# against as_of on every run, not just recorded). Past `review_by`, the
# exception is treated as EXPIRED — the alert returns, loudly, with the
# expiry date in the message, distinct from a brand-new defect.
#
# Scoped strictly to (currency, indicator) — an exception here can NEVER
# suppress a different series. A newly-stale series, or a different
# indicator on the SAME currency, always alerts independently of any
# exception listed below.
#
# `review_by` is chosen from each series' own next-expected-publication
# date, not arbitrarily — see the reasoning in each entry's comment.

exceptions:
  # AUD core_cpi entry REMOVED 2026-08 (the taxonomy decision this entry's
  # own comment called for): core_cpi's currency whitelist no longer
  # includes AUD at all (data/economic_indicators.yaml) — the dead RBA
  # Trimmed Mean CPI y/y slot is gone, not merely stale, so there is no
  # (AUD, core_cpi) scored slot left for an exception to apply to.
  # AUD's replacement monthly CPI reporting is now scored directly as
  # cpi_monthly / trimmed_mean_cpi_monthly (promoted the same change,
  # mirroring the CAD Core CPI -> Median CPI y/y promotion this entry
  # referenced). Removed rather than rewritten: find_orphaned_exceptions
  # would flag a rewritten entry the same way — there's nothing left to
  # except.
  - scope: calendar
    currency: USD
    indicator: core_cpi
    reason: >
      JBlanked delivers a native "Core CPI y/y" event (real y/y level) as
      a SEPARATE, unmapped raw name (config/ff_aliases.yaml has no identity
      alias for it) — silently dropped as unmapped. The row that IS mapped
      ("Core CPI m/m", aliased with an xf transform) came in as actual=0.0
      on 2026-07-14, itself flagged "Bad Data" by JBlanked, and was
      correctly zero-quarantined to NaN by scoring — leaving no valid
      actual for July at all despite a real 2.6 sitting unused in the same
      feed under a different raw name.
    doc: docs/calendar-freshness-per-currency.md
    # review_by: USD Core CPI publishes monthly, median 30-day gap; last
    # (defective) print 2026-07-14 -> next expected ~2026-08-13. review_by
    # gives about a week past that for the daily actuals pull to have run,
    # so by this date there's a second live data point confirming whether
    # the native-y/y-unmapped + m/m-zero-quarantine pattern recurs (making
    # the case for an alias fix stronger) or was a one-off.
    review_by: "2026-08-20"
