# TREND v2 — 3-layer daily trend score (−3…+3). Replaces the MA×ADX design.
# Layer 1 REGIME (dominant, −2…+2): bull_points = (close>SMA50)+(close>SMA200)+(SMA50>SMA200)
#   mapped 3→+2, 2→+1, 1→−1, 0→−2 (no neutral state — neutrality comes from momentum).
# Layer 2 MOMENTUM (−1…+1): slope_atr = (SMA50[0]−SMA50[lookback]) / (lookback × ATR14),
#   > +thresh → +1, < −thresh → −1, else 0. ATR-normalized so it scales across instruments.
# Layer 3 ADX: DISPLAY-ONLY ("trend quality"), no effect on the score.
# Final = clamp(regime + momentum, −3, +3). <min_bars valid closes → None (excluded).
regime:
  sma_mid: 50
  sma_long: 200
momentum:
  slope_lookback: 20        # bars over which the SMA50 slope is measured
  atr_period: 14
  # HYSTERESIS (replaces the single slope_thresh_atr): momentum ±1 ACTIVATES when
  # |slope_atr| > slope_enter and PERSISTS until |slope_atr| < slope_exit; in the band
  # [slope_exit, slope_enter] it keeps the previous state. No prior state (cold start) →
  # active only if > slope_enter. State is derived by walking the historical slope_atr
  # series (stateless — the "state" is price_history.parquet), so it is fully reproducible.
  slope_enter: 0.035        # CALIBRATION: activate ±1 above this
  slope_exit: 0.025         # CALIBRATION: deactivate to 0 below this
min_bars: 200               # need SMA_long (200) closes; else trend cell = None
adx_period: 14              # display-only trend-quality metric
