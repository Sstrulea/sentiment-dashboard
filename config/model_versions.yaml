# Model versions (audit 6B). The newest entry is payload.meta.model; /economic and
# /strength show a discreet note for `notice_days` after `since`, so bias jumps on
# that day are attributed to the method, not the market. Append, never rewrite.
notice_days: 14
versions:
  - version: "2026.09.24"
    since: 2026-09-24
    changes: "monetary on the 2Y spread (5-observation averaged ends, common dates) + symmetric sentiment fold"
  - version: "2026.10.07"
    since: 2026-10-07
    changes: "factors on the same scale (σ), continuous rates, cross-asset macro on category means, re-derived thresholds"
  - version: "2026.10.07-v3"
    since: 2026-10-07
    changes: "scoring v3: currency score = 51% macro + 34% carry (policy-rate differential) + 15% COT; indices 67% macro + 33% 3-month rates (asymmetric); metals 56/33/11; bias from each instrument's usual size; 2Y repricing, P/C and bank reserves no longer scored"
  - version: "2026.10.08-metals"
    since: 2026-10-08
    changes: "metals: 67% US 2Y 3-month rates + 33% US macro; COT removed"
  - version: "2026.11.25-v4"
    since: 2026-11-25
    changes: "FX scoring v4: pair score = COT positioning only (Level + Flow); macro and carry no longer scored on the FX board; bias from each instrument's usual size, recalibrated weekly from the COT history; indices and metals unchanged"
