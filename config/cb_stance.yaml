# Stance (S0a) - PRE-REGISTERED parameters, frozen 2026-11-14 (v3: S1.1 corrections, same day). Display-only (ARCHITECTURE section 4).
# Any change = a new entry in `versions` (with the reason), never an edit of a frozen one. The computation is phase S1
# (src/cb_compute/, pure); this file is only read and validated in S0a (src/cb_datasets.load_stance_config).
#
#   stance  = policy rate - neutral (nominal)
#   x       = (pi_underlying - target) + y / 3          need; y = output gap, or -okun * (u - u*)
#   G       = inflation_response * x - stance            pressure
#   situations (delta, epsilon in pp):  |x| <= epsilon:  S0 if |G| <= delta, else S2
#                                        otherwise d = sign(x):  S1 if d * G > delta, else S3
#   computed on today's data and "in 12 months if the rate stays" (horizon_months).

meta:
  version: 1
  frozen: 2026-11-14
  current: 3

versions:
  - version: 1
    frozen: 2026-11-14
    reason: "initial pre-registration (prompt S0a)"
    rule:
      inflation_response: 1.5
      output_gap_response: 0.5
      okun_coefficient: 2.0            # y = -2 * (u - u*)  where the bank's slack measure is an unemployment gap
      need: "x = (pi_underlying - target) + y / 3"
      pressure: "G = 1.5 * x - stance"
    gap:
      point_target: "pi - value"
      band_with_declared_midpoint: "pi - midpoint"
      band_without_declared_midpoint: "distance to the nearest band edge; 0 inside the band (CHF)"
    situations:
      delta_pp: 0.25
      epsilon_pp: 0.5
      rule: "|x| <= epsilon: S0 if |G| <= delta else S2; otherwise d = sign(x): S1 if d*G > delta else S3"
    horizon_months: 12
    underlying_rule:                   # applied in order; data/cb/manual/mandates.yaml records which one each bank uses
      - "(1) the core measure officially designated by the bank"
      - "(2) the measure projected by the bank that excludes food and energy"
      - "(3) the statistics institute's measure excluding food and energy"
    basis:
      today: "underlying (the headline is shown next to it)"
      forecast: "the same measure; otherwise the headline, flagged"
    slack: "only the bank's own estimate; missing = none (no proxy)"
    neutral_combine:
      USD: "mid = median of the longer-run dots; range = min-max of the longer-run dots"
      NZD: "mid = the 'policy horizon' estimate when published; range = min-max of the estimates"
      GBP: "mid = median of the members' statements of the last 12 months; range = min-max (only with >= 2 statements)"
      other: "as published: a point -> mid; low/high -> range with mid = their mean"
      real_to_nominal: "+ the target (point or midpoint)"
    staleness:
      forecast: "a newer projection publication has passed (meetings.yaml has_projections)"
      neutral_months: 15
      macro: "the last period is older than its frequency + the typical lag (config/cb_official.yaml macro lag_days + stale_grace_days)"
    verification: "the mandate is re-verified at every new projection publication of the bank; at most 12 months"

  - version: 2
    frozen: 2026-11-14
    reason: "S0a review (prompt S1, part A3), before any computation - the pre-registration stays valid. Rules v1 left implicit are made explicit."
    changes:
      - {field: neutral_combine.GBP, reason: "v1 took every statement of the last 12 months: one member who speaks often (Taylor x5) would dominate the median; one value per member in office is the members' view"}
      - {field: neutral_combine.model_list, reason: "v1 had no rule for a list of model estimates (RBA: 6 models); median / min-max as for the dots"}
      - {field: neutral_combine.nominal, reason: "v1 converted everything real -> nominal; a source that publishes nominal (ECB) is used directly, no double conversion"}
      - {field: slack.today, reason: "v1 'only the bank's estimate' did not say which period; the latest estimate for a period already begun at the as-of"}
      - {field: horizon_rule, reason: "v1 did not say how '12 months' maps onto annual / fiscal / March-year / quarterly publications; no interpolation"}
      - {field: boundary_tol_pp, reason: "new: flags a situation within 0.05 pp of its threshold"}
      - {field: horizon_consistency_pp, reason: "new: market lens - the bank's last projection within 0.25 pp of the target = consistent"}
      - {field: staleness.neutral_stale, reason: "v1 did not say what stale does; it is a flag only, never n/a"}
    rule:
      inflation_response: 1.5
      output_gap_response: 0.5
      okun_coefficient: 2.0
      need: "x = gap(pi_underlying) + y / 3;  x_headline = gap(pi_headline) + y / 3"
      pressure: "G = 1.5 * x - S;  S = i - N_mid (S_lo = i - N_hi, S_hi = i - N_lo)"
    gap:
      point_target: "pi - value"
      band_with_declared_midpoint: "pi - midpoint"
      band_without_declared_midpoint: "max(0, pi - high) + min(0, pi - low) (CHF)"
    situations:
      delta_pp: 0.25
      epsilon_pp: 0.5
      rule: "|x| <= epsilon: S0 if |G| <= delta else S2 (direction sign(G)); otherwise d = sign(x): S1 (direction d) if d*G > delta else S3; no neutral: situation null + need_only"
    boundary_tol_pp: 0.05
    horizon_consistency_pp: 0.25
    horizon_months: 12
    horizon_rule: "the projection for the PUBLISHED period (calendar year, fiscal year, year ended in March, quarter) that contains as-of + 12 months; the narrowest such period; no interpolation; a publication that does not cover it -> n/a; slack without a projection -> today's slack + flag slack_held"
    underlying_rule:
      - "(1) the core measure officially designated by the bank"
      - "(2) the measure projected by the bank that excludes food and energy"
      - "(3) the statistics institute's measure excluding food and energy"
    basis:
      today: "underlying (the headline is shown next to it)"
      forecast: "the same measure; otherwise the headline, flag headline_basis"
    slack:
      source: "only the bank's own estimate; missing = none (flag no_slack, the term is left out)"
      today: "the latest published estimate for a period already begun at the as-of (latest start; a tie -> the narrower period); a range -> its midpoint, the range is kept"
      unemployment: "y = -okun * (u - u*), u = the latest official observation, u* = the SEP longer-run median (USD) or the SMP NAIRU (AUD)"
    neutral_combine:
      USD: "mid = median of the longer-run dots; range = min-max of the longer-run dots"
      GBP: "MPC members in office at the as-of (config/cb_roster.yaml); the LATEST statement of each in the last 12 months; member value = the point or the middle of the member's range; mid = median over members; range = min-max over members"
      model_list: "a list of model estimates (RBA: 6 models): mid = median, range = min-max"
      NZD: "mid = the 'policy horizon' estimate when published; range = min-max of the estimates"
      other: "as published: a point -> mid; low/high -> range with mid = their mean"
      nominal: "a source that publishes nominal (ECB) is used directly; otherwise real + the target (point or declared midpoint)"
    staleness:
      forecast: "a newer projection publication has passed (meetings.yaml has_projections)"
      neutral_months: 15
      neutral_stale: "a flag only, never n/a"
      macro: "the next period is overdue by more than lag_days + stale_grace_days (config/cb_official.yaml macro)"
    verification: "the mandate is re-verified at every new projection publication of the bank; at most 12 months"
  - version: 3
    frozen: 2026-11-14
    reason: "S1 review (prompt S1.1 + S2, part A) - corrections before the S1 merge; the rule, the parameters and the situations are unchanged"
    changes:
      - {field: cycle, reason: "v2 counted the cycle on decisions.parquet (from 2025-09, with gaps); the full official trajectory from 2015 (BIS WS_CBPOL, EUR the ECB DFR) is needed to know the stage"}
      - {field: period_rule, reason: "v2 had two rules (today: latest start; 12 months: narrowest containing) that disagreed (NZD slack today read 2026Q2 instead of the March-year 2027 that contains the as-of); one rule"}
      - {field: neutral_combine.USD, reason: "v2 recomputed the median from the dots (3.25) where Table 1 publishes 3.2; the published median and range are the Fed's own figures, the dots are only a check"}
      - {field: neutral_combine.GBP, reason: "v2 took the range from the members' midpoints only, losing the bounds a member declared (Taylor 2.75-3.0)"}
      - {field: flags_12m, reason: "boundary and neutral_sensitive were computed only for today; the 12-month situation has the same thresholds and the same neutral interval"}
      - {field: horizon_consistency, reason: "v2 labelled the horizon gap only for the market / constant_rate lens; the label applies to every bank with a projection"}
      - {field: lens.own_path, reason: "v2 recomputed a GAP for own_path banks (NZD showed GAP n/a); the lens is exactly the comparison the bank page shows (USD vs dots, NZD vs OCR track, ESTIMATE)"}
    rule:
      inflation_response: 1.5
      output_gap_response: 0.5
      okun_coefficient: 2.0
      need: "x = gap(pi_underlying) + y / 3;  x_headline = gap(pi_headline) + y / 3"
      pressure: "G = 1.5 * x - S;  S = i - N_mid (S_lo = i - N_hi, S_hi = i - N_lo)"
    gap:
      point_target: "pi - value"
      band_with_declared_midpoint: "pi - midpoint"
      band_without_declared_midpoint: "max(0, pi - high) + min(0, pi - low) (CHF)"
    situations:
      delta_pp: 0.25
      epsilon_pp: 0.5
      rule: "|x| <= epsilon: S0 if |G| <= delta else S2 (direction sign(G)); otherwise d = sign(x): S1 (direction d) if d*G > delta else S3; no neutral: situation null + need_only"
    boundary_tol_pp: 0.05
    horizon_consistency_pp: 0.25
    horizon_months: 12
    period_rule: "one rule for every projection read: the SHORTEST published period (calendar year, fiscal year, year ended in March, quarter) that contains the target date; for today (target = as-of), when no period contains the as-of, the last period that has ended (latest end; a tie -> the shorter); no interpolation"
    horizon_rule: "the projection chosen by period_rule for as-of + 12 months; a publication that does not cover it -> n/a; slack without a projection -> today's slack + flag slack_held"
    flags_12m: "boundary and neutral_sensitive are computed for the 12-month classification too (same tolerance, same neutral interval), reported apart from today's flags"
    horizon_consistency: "every bank with a projection: |gap of the bank's furthest projection| <= horizon_consistency_pp -> consistent, else inconsistent"
    lens:
      own_path: "exactly the bank page comparison (existing payload): the GAP vs the bank's path for the year of as-of + 12 months (USD: dots); RBNZ: OCR track vs the market (ESTIMATE)"
      market: "the market move since the projection cutoff to as-of + 12 months, in bp"
      constant_rate: "the market rate at as-of + 12 months minus the constant rate assumed in the forecast, in bp"
    cycle: "from the full official trajectory (config/cb_official.yaml policy_history: BIS WS_CBPOL from 2015, EUR the ECB DFR); a move = a change of value; date = the decision day (decisions.parquet, same sign, effective within 7 days), else the effective date, marked; moves after the last history observation from decisions.parquet; stage = consecutive moves in one direction (holds in between allowed); holds since the last move counted on decisions.parquet"
    underlying_rule:
      - "(1) the core measure officially designated by the bank"
      - "(2) the measure projected by the bank that excludes food and energy"
      - "(3) the statistics institute's measure excluding food and energy"
    basis:
      today: "underlying (the headline is shown next to it)"
      forecast: "the same measure; otherwise the headline, flag headline_basis"
    slack:
      source: "only the bank's own estimate; missing = none (flag no_slack, the term is left out)"
      today: "the estimate chosen by period_rule for the as-of; a range -> its midpoint, the range is kept"
      unemployment: "y = -okun * (u - u*), u = the latest official observation, u* = the SEP longer-run median (USD) or the SMP NAIRU (AUD)"
    neutral_combine:
      USD: "mid = the longer-run federal funds median published in SEP Table 1; range = the longer-run Range of Table 1; check: the median of the dots rounded half to even at 0.1 must equal the published median, else an alert (--status, report)"
      GBP: "MPC members in office at the as-of (config/cb_roster.yaml); the LATEST statement of each in the last 12 months; member value = the point or the middle of the member's range; mid = median over members; range = min-max of every bound the members declared (points, lows, highs)"
      model_list: "a list of model estimates (RBA: 6 models): mid = median, range = min-max"
      NZD: "mid = the 'policy horizon' estimate when published; range = min-max of the estimates"
      other: "as published: a point -> mid; low/high -> range with mid = their mean"
      nominal: "a source that publishes nominal (ECB) is used directly; otherwise real + the target (point or declared midpoint)"
    staleness:
      forecast: "a newer projection publication has passed (meetings.yaml has_projections)"
      neutral_months: 15
      neutral_stale: "a flag only, never n/a"
      macro: "the next period is overdue by more than lag_days + stale_grace_days (config/cb_official.yaml macro)"
    verification: "the mandate is re-verified at every new projection publication of the bank; at most 12 months"

# ---------------------------------------------------------------------------------------------------------------------
# stance-ui-v5 (frozen 2026-11-16, before any display): the DISPLAYED stance - Position / Need / Why (src/cb_compute/stance_v5.py).
# Pre-registered; never tuned on results. The computation of the versions above (Taylor-type pressure, S0-S3) is still computed
# and stored in stance_history, not displayed.
v5:
  frozen: 2026-11-16
  position: "P = policy rate - neutral_mid (the bank's own neutral; none -> n/a with the reason)"
  need: "N = core - target (point or declared midpoint); a band without a declared midpoint: 0 inside, else the distance to the nearest edge"
  scale_pp: [0.25, 0.75, 1.5]           # |x| <= 0.25 / <= 0.75 / <= 1.5 / > 1.5, the same for P and N
  p_labels: [Neutral, "Slightly restrictive|stimulative", "Restrictive|Stimulative", "Very restrictive|stimulative"]
  n_labels: [Near target, "Slightly above|below target", "Above|Below target", "Well above|below target"]
  step_pp: 0.25                         # own published path: whole 0.25 steps between the rate and the path at the horizon (half away from zero)
  no_move_pp: 0.25                      # a) |N| <= 0.25
  restrictive_side_pp: 0.25             # e) P.d <= 0.25 -> move in d
  forecast_improvement_pp: 0.25         # f) the forecast cuts |N| by >= 0.25 at the horizon ...
  path_add_pp: 0.25                     # ... AND the assumed path adds < 0.25 in d (not published: < 0.25, "(rate path not published)")
  borderline_tol_pp: 0.05               # borderline: the conclusion changes inside the neutral interval or at +-0.05 of a threshold
  horizon: "the published period containing as-of + 12 months (period_rule of v3)"
  order: [a_no_move, b_own_path, c_constant_rate, d_na, e_not_restrictive, f_forecast_and_path]

# ---------------------------------------------------------------------------------------------------------------------
# stance-ui-v6 (frozen 2026-11-23, before any display code): the DISPLAYED stance - Position / Need / Why without a verdict
# (src/cb_compute/stance_v6.py). Pre-registered; never tuned on results. Position and Need use the bank's own inflation forecast;
# Why shows three readings (Taylor rule, the bank, the market), no conclusion. v6 reads the v3 values already computed (G, G_12m,
# gap_12m, lens); the versions above and v5 are still computed and stored exactly as before.
v6:
  frozen: 2026-11-23
  forecast: "pi_fc = the bank's projection chosen by the v3 horizon_rule (the shortest published period containing as-of + 12 months): the underlying measure, else the headline (flag headline_basis); its period and definition are always displayed"
  position: "P = (rate - pi_fc) - (neutral_mid - target); P_lo uses neutral_hi, P_hi uses neutral_lo; target = the point or the declared midpoint; no neutral, no pi_fc or a band without a declared midpoint -> n/a with the reason"
  need: "N = gap(pi_fc) as in v3: point -> pi_fc - value; declared midpoint -> pi_fc - midpoint; band without a declared midpoint -> 0 inside, else the distance to the nearest edge"
  scale_pp: [0.25, 0.75, 1.5]
  p_labels: [Neutral, "Slightly restrictive|stimulative", "Restrictive|Stimulative", "Very restrictive|stimulative"]
  n_labels: [Near target, "Slightly above|below target", "Above|Below target", "Well above|below target"]
  taylor: "T = neutral + 1.5 * gap(pi) + 0.5 * y - rate (= v3 G = 1.5 * x - S); y as in v3: the published output gap; unemployment-gap banks -2 * (u - u*); none -> the term is left out (flag no_slack)"
  scenarios:
    today: "pi = the underlying measure today, y = today's slack (v3 G, G_lo, G_hi)"
    forecast: "pi = pi_fc, y = the projected slack for the same period, else today's slack held (flag slack_held) (v3 G_12m, G_12m_lo, G_12m_hi)"
  reading:
    - "a = T_today, b = T_forecast, both at neutral_mid; a * b < 0 -> Mixed signals"
    - "else the four ends (each scenario at neutral_lo and neutral_hi) all > 0 -> Tightening pressure, robust to the neutral range; all < 0 -> Easing pressure, robust to the neutral range"
    - "else -> Tightening / Easing pressure, sensitive to the neutral range, by sign(a) (sign(b) when a = 0); a = b = 0 -> No pressure at the neutral midpoint"
    - "one scenario n/a -> the same test on the other scenario alone (its two ends), with the reason of the missing one"
    - "no neutral -> n/a with the reason of Position"
  bank_row: "the bank's own published path (Fed dots, RBNZ OCR track) up to the period of pi_fc; otherwise the rate conditioning of the forecast (market curve at the cutoff | unchanged rate | not published); the vote at the last decision"
  market_row: "the next 2 meetings of the implied path (bp vs the current rate, probability where EXACT / CURVE), the change of each over 1 week (the 'Delta vs 1w' of the By meeting table), the market data date and its stale flag (meta.stale_after_bd), the v3 lens (market minus the bank path at the same date, bp)"
  rounding: "classification on unrounded values; display pp with 2 decimals, half-up (payload._r2)"
