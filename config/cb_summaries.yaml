# Phase 2b - factual summaries of the official texts (docs/central-banks/ARCHITECTURE.md section 15).
# The model, its limits and the per-run caps are fixed here; a prompt change is a new prompt_version (src/cb_summarize/prompts/), never an edit in place.
model: claude-sonnet-5
max_tokens: 3000
temperature: 0
api:
  url: https://api.anthropic.com/v1/messages
  version: "2023-06-01"
  env_key: ANTHROPIC_API_KEY          # GitHub secret in CI, environment variable locally; missing -> the stage is skipped (a warning in --status, not an error)
  timeout_s: 180
  transport_retries: 2                # 429 / 5xx / timeouts only; the validation retry is separate and is exactly one
backfill_meetings: 4                  # the last N decided meetings per bank
speech_window_days: 60                # speeches / testimony that passed the monetary-relevance filter and are this recent
max_source_chars: 120000              # longer documents are cut at a paragraph boundary and marked truncated in the record
chars_per_token: 3                    # only to estimate the input size before a call (the response carries the real usage); ~30% more tokens than the old 4 chars / token (newer tokenizer)
estimate_output_tokens: 700           # ASSUMPTION for the dry-run estimate only: the typical output of one summary (3-6 points, 1-5 quotes)
run_caps:                             # a run stops cleanly and reports when either is reached
  max_documents: 12
  max_input_tokens: 250000
priority:                             # what is summarised first (1 = first)
  statement: 1
  presser_transcript: 2
  opening_statement: 2
  minutes: 3
  account: 3
  summary_of_opinions: 3
  deliberations: 3
  speech: 4
  testimony: 4
limits:                               # the automatic check before anything is written
  summary_points: [3, 6]
  point_chars: [20, 400]
  quotes: [1, 5]
  quote_chars: [15, 500]
  summary_total_chars: 1800
blocked_words:                        # direction / evaluation vocabulary: never in a summary point, whatever the document says (a quote is the bank's own words: not checked)
  - hawkish
  - dovish
  - bullish
  - bearish
  - paves the way
  - paved the way
  - paving the way
attributed_words:                     # allowed in a summary point ONLY when the document itself uses the same word AND the point attributes it to the bank
  - likely                            # ("The Committee expects ..."): banks write "expects", "is likely", "suggests" all the time, and reporting that is not an opinion
  - expects
  - signals
  - signal
  - signalled
  - signaled
  - signalling
  - signaling
  - suggests
  - suggest
  - suggested
  - suggesting
attribution_subjects:                 # one of these must come earlier in the same sentence of the point (the bank, its body or its officers, or its own document)
  - Committee
  - Board
  - Bank
  - Council
  - Governor
  - Chair
  - Chairman
  - Chairperson
  - President
  - Vice-President
  - members
  - participants
  - speaker
  - Federal Reserve
  - FOMC
  - ECB
  - RBA
  - RBNZ
  - SNB
  - BoJ
  - BoE
  - BoC
  - MPC
  - statement
  - minutes
  - account
  - summary
  - transcript
  - speech
  - testimony
  - document
# List prices in USD per million tokens, used for the cost estimate in --status and the reports (nothing else reads them). Read on the official price page
# on 2026-09-21: "Claude Sonnet 5 | Base input tokens $2 / MTok | Output tokens $10 / MTok"; the page adds that the $2 / $10 introductory price of 2026-08-31 "is
# now the standard price" and that the increase to $3 / $15 on 2026-09-01 "will not occur". Batch API (50% off), prompt caching and US data residency (x1.1)
# are not used here. The page also says the tokenizer of Claude 4.7 and later produces about 30% more tokens for the same text: `chars_per_token` is 3, not 4.
pricing_usd_per_mtok:
  input: 2.0
  output: 10.0
pricing_source: https://platform.claude.com/docs/en/about-claude/pricing
pricing_checked: "2026-09-21"
