# RBNZ inputs that cannot be collected: rbnz.govt.nz sits behind a Cloudflare challenge (HTTP 403 for every client,
# 0A/0B). Everything else about the RBNZ is automatic: the rate decision comes from FF (validated on the official
# meeting) and BIS WS_CBPOL. What stays manual:
#   * the OCR track of every Monetary Policy Statement (MPS) - the bank's own path, quarterly averages;
#   * the meeting calendar after 2027-02-17 (RBNZ published it only until then).
# `python -m src.cb_collect --status` warns when an MPS that has passed has no filled track, and when the calendar
# runs out. Only the latest MPS needs a track.
#
# How to fill an MPS (from the MPS PDF / the OCR projection table):
#   status: filled
#   source: {url: <PDF or page URL>, page: "<page / table number>", retrieved: <YYYY-MM-DD>}
#   ocr_track: [{period: 2026Q4, value: 2.75}, ...]        # percent, quarterly average OCR projection
#   bank_bill_90d: [{period: 2026Q4, value: 2.90}, ...]    # optional, the 90-day bank bill projection
# Nothing may be typed from memory: a `filled` entry needs a source url and page.

meta:
  version: 1
  owner: manual
  updated: 2026-09-20

# The published meeting calendar (the RBNZ release "Monetary policy and OCR decision dates until February 2027",
# transcribed via web search because rbnz.govt.nz is bot-walled). scripts/cb_gen_meetings.py reads it: source manual.
# has_projections = the meeting is an MPS.
published_calendar:
  source: "RBNZ: Monetary policy and OCR decision dates until February 2027 (via web search; site bot-walled)"
  meetings:
    - {date: 2026-02-18, has_projections: true}
    - {date: 2026-04-08, has_projections: false}
    - {date: 2026-05-27, has_projections: true}
    - {date: 2026-07-08, has_projections: false}
    - {date: 2026-09-02, has_projections: true}
    - {date: 2026-10-28, has_projections: false}
    - {date: 2026-12-09, has_projections: true}
    - {date: 2027-02-17, has_projections: true}

calendar_2027:
  status: pending                   # pending | entered
  published_until: 2027-02-17       # last meeting date RBNZ has published (meetings.yaml carries the rows up to it)
  expected: "with the RBNZ release of the February 2027 dates"
  meetings: []                      # when entered: [{date: 2027-05-26, has_projections: true}, ...]

mps:
  # Only the latest MPS is needed (its OCR track and 90-day bank bill projection feed the GAP): Sep 2026.
  - {meeting: 2026-09-02, status: placeholder, source: null, ocr_track: [], bank_bill_90d: []}
