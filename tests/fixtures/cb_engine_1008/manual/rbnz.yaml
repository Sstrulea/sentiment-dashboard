# RBNZ inputs that cannot be collected: rbnz.govt.nz sits behind a Cloudflare challenge (HTTP 403 for every client,
# 0A/0B). Everything else about the RBNZ is automatic: the rate decision comes from FF (validated on the official
# meeting) and BIS WS_CBPOL. What stays manual:
#   * the OCR track of the LATEST Monetary Policy Statement (MPS) - the bank's own path, quarterly averages;
#   * the meeting calendar (RBNZ has published it to 2028-02-09).
# `python -m src.cb_collect --status` warns only when an MPS NEWER than the one in this file has passed (the Feb / May
# 2026 MPS are not needed), and when the calendar runs out. Only the latest MPS needs a track.
#
# How to fill an MPS (from the MPS PDF / the OCR projection table):
#   status: filled
#   source: {url: <PDF or page URL>, page: "<page / table number>", retrieved: <YYYY-MM-DD>}
#   ocr_track: [{period: 2026Q4, value: 2.75}, ...]        # percent, quarterly average OCR projection (YYYYQn)
#   bank_bill_90d: [{period: 2026Q4, value: 2.90}, ...]    # optional, the 90-day bank bill projection
# Nothing may be typed from memory: a `filled` entry needs a source url and page.

meta:
  version: 1
  owner: manual
  updated: 2026-10-09

# The published meeting calendar. 2026-10-28 onwards: the RBNZ release "OCR decision dates and Financial Stability Report
# dates to February 2028" (published 2026-02-19, updated 2026-09-18), transcribed 2026-10-09 by hand from the page (rbnz.govt.nz
# is bot-walled for scripts); it replaces the earlier release "Monetary policy and OCR decision dates until February 2027",
# which had 2027-02-17 - the RBNZ moved to 8 meetings a year from 2027. The meetings already held in 2026 come from that
# earlier release. scripts/cb_gen_meetings.py reads this list (source: manual; rows up to the end of its range, 2027-12-31).
# has_projections = the meeting is a Monetary Policy Statement (the Monetary Policy Reviews have none).
published_calendar:
  source: "RBNZ: OCR decision dates and Financial Stability Report dates to February 2028 (published 2026-02-19, updated 2026-09-18), https://www.rbnz.govt.nz/news-and-events/how-we-release-information/ocr-decision-dates-and-financial-stability-report-dates-to-feb-2028 - transcribed 2026-10-09 (site bot-walled); 2026 meetings held before 2026-10-28 from the earlier release 'Monetary policy and OCR decision dates until February 2027' (via web search)"
  meetings:
    - {date: 2026-02-18, has_projections: true}
    - {date: 2026-04-08, has_projections: false}
    - {date: 2026-05-27, has_projections: true}
    - {date: 2026-07-08, has_projections: false}
    - {date: 2026-09-02, has_projections: true}
    - {date: 2026-10-28, has_projections: false}     # Review
    - {date: 2026-12-09, has_projections: true}      # Statement
    - {date: 2027-02-10, has_projections: false}     # Review
    - {date: 2027-03-17, has_projections: true}      # Statement
    - {date: 2027-05-05, has_projections: false}     # Review
    - {date: 2027-06-16, has_projections: true}      # Statement
    - {date: 2027-08-04, has_projections: false}     # Review
    - {date: 2027-09-15, has_projections: true}      # Statement
    - {date: 2027-10-27, has_projections: false}     # Review
    - {date: 2027-12-08, has_projections: true}      # Statement
    - {date: 2028-02-09, has_projections: false}     # Review

calendar_2027:
  status: entered                   # pending | entered
  published_until: 2028-02-09       # last meeting date RBNZ has published (meetings.yaml carries the rows up to 2027-12-31)
  entered: 2026-10-09
  source: "the release to February 2028 above"
  meetings:                         # the dates after the earlier release's end (2027-02-17, now replaced by 2027-02-10)
    - {date: 2027-02-10, has_projections: false}
    - {date: 2027-03-17, has_projections: true}
    - {date: 2027-05-05, has_projections: false}
    - {date: 2027-06-16, has_projections: true}
    - {date: 2027-08-04, has_projections: false}
    - {date: 2027-09-15, has_projections: true}
    - {date: 2027-10-27, has_projections: false}
    - {date: 2027-12-08, has_projections: true}
    - {date: 2028-02-09, has_projections: false}

mps:
  # Only the latest MPS is needed (its OCR track is the bank's own path; the 90-day bank bill projection, when the tables
  # carry it, feeds the RBNZ GAP): Sep 2026.
  - meeting: 2026-09-02
    status: filled
    source:
      url: https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/publications/monetary-policy-statements/2026/sep-2926/mps_report_sep2026.pdf
      page: "Appendix 1, Table 6.1, p. 50"
      retrieved: 2026-09-20
    projections_finalised: 2026-08-26
    transcription: "manual, from the official PDF (quarterly averages, rounded to 0.1 as published). The XLSX with decimals is on the MPS page but is blocked for scripts."
    ocr_track:
      - {period: 2026Q3, value: 2.6}
      - {period: 2026Q4, value: 2.8}
      - {period: 2027Q1, value: 3.0}
      - {period: 2027Q2, value: 3.1}
      - {period: 2027Q3, value: 3.1}
      - {period: 2027Q4, value: 3.2}
      - {period: 2028Q1, value: 3.2}
      - {period: 2028Q2, value: 3.2}
      - {period: 2028Q3, value: 3.2}
      - {period: 2028Q4, value: 3.2}
      - {period: 2029Q1, value: 3.3}
      - {period: 2029Q2, value: 3.3}
      - {period: 2029Q3, value: 3.3}
    bank_bill_90d: []                # the PDF tables carry no 90-day bank bill projection: the RBNZ GAP stays n/a (same-basis rule)
